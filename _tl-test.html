<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JD — Life in 3D</title>
<style>
  :root{ --bg:#04060c; --ink:#e8eaf0; --dim:#8a90a3; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; height:100vh; overflow:hidden; }
  header{ position:fixed; top:0; left:0; right:0; z-index:10; display:flex; align-items:center; gap:14px; padding:14px 20px; background:linear-gradient(180deg,rgba(4,6,12,.95),transparent); pointer-events:none; }
  header h1{ font-size:17px; font-weight:650; }
  header .sub{ color:var(--dim); font-size:12px; }
  .legend{ display:flex; gap:6px; font-size:11px; color:var(--dim); margin-left:8px; flex-wrap:wrap; align-items:center; }
  .legend i{ display:inline-block; width:9px; height:9px; margin-right:4px; vertical-align:0; }
  .toggles{ margin-left:auto; display:flex; gap:8px; pointer-events:auto; }
  .toggles button{ background:#101623; color:var(--ink); border:1px solid #232c42; border-radius:8px; padding:7px 14px; font-size:13px; cursor:pointer; }
  .toggles button.on{ background:#2b3a5e; border-color:#4a6aa8; }
  #app{ position:absolute; inset:0; }
  canvas{ display:block; }
  .lbl{ font-size:11px; color:var(--ink); text-shadow:0 1px 8px #000,0 0 14px #000; white-space:nowrap; pointer-events:none; text-align:center; }
  .lbl small{ display:block; color:var(--dim); font-size:9.5px; }
  .yr{ font-size:10px; color:#5a6280; letter-spacing:2px; pointer-events:none; }
  #card{ position:fixed; right:18px; top:76px; width:310px; background:#0d1322f2; border:1px solid #232c42; border-radius:14px; padding:18px; z-index:10; display:none; box-shadow:0 12px 40px rgba(0,0,0,.6); }
  #card.show{ display:block; }
  #card .cat{ font-size:10.5px; text-transform:uppercase; letter-spacing:1.2px; margin-bottom:6px; }
  #card h2{ font-size:16px; margin-bottom:4px; }
  #card .when{ color:var(--dim); font-size:12px; margin-bottom:10px; }
  #card p{ font-size:13px; line-height:1.55; color:#c9cede; }
  #card .x{ position:absolute; top:10px; right:12px; background:none; border:none; color:var(--dim); font-size:16px; cursor:pointer; }
  #hint{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); color:var(--dim); font-size:11.5px; z-index:10; pointer-events:none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <div><h1>Life in 3D</h1><div class="sub">time is distance · duration is height</div></div>
  <div class="legend" id="legend"></div>
  <div class="toggles"><button id="b2d" class="on">2D</button><button id="b3d">3D</button></div>
</header>
<div id="app"></div>
<div id="card"><button class="x" onclick="card.classList.remove('show')">✕</button><div class="cat" id="ccat"></div><h2 id="ctitle"></h2><div class="when" id="cwhen"></div><p id="cdesc"></p></div>
<div id="hint">drag to orbit · scroll to zoom · right-drag to pan · click an object</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const CATS = {
  work:{c:0x5aa2ff,label:"Work",shape:"box"},
  biz:{c:0xf0b44c,label:"Business",shape:"torus"},
  mil:{c:0x6fdc8c,label:"Military",shape:"octa"},
  edu:{c:0xb48cff,label:"Education",shape:"icosa"},
  life:{c:0x4fd8c8,label:"Travel & Life",shape:"sphere"}
};
const EV = [
  {t:"JD Meyers Productions", d:"2016 – present", y0:2016.2, y1:2026.8, cat:"biz", desc:"Photography / videography / drone, Potsdam NY. DBA 2018. FAA Part 107 (2018)."},
  {t:"Homeschooled K–12", d:"graduated 2019", y:2019.4, cat:"edu", desc:"K–12 homeschooling in St. Lawrence County."},
  {t:"Precise Biometrics", d:"Lab Specialist", y0:2019.7, y1:2020.6, cat:"work", desc:"Lab Specialist — early career."},
  {t:"Lived in Madrid, NY", d:"Mar 2020 – Jun 2022", y0:2020.2, y1:2022.5, cat:"life", desc:"Lived with Catherine and Jeeves Green in Madrid, NY."},
  {t:"SkyWest / Contour", d:"Cross-Utilized Agent", y0:2021.3, y1:2022.4, cat:"work", desc:"Airline cross-utilized agent."},
  {t:"Canton-Potsdam Hospital", d:"Security", y0:2022.5, y1:2024.9, cat:"work", desc:"Hospital security under director Wayne Lougheed."},
  {t:"B.Tech — SUNY Canton", d:"Criminal Investigations · 2023", y:2023.4, cat:"edu", desc:"B.Tech, SUNY Canton. Inductive reasoning, criminal profiling."},
  {t:"National Coffee Corp", d:"Delivery · The Bagelry", y0:2023.5, y1:2024.2, cat:"work", desc:"Delivery work per his Merit profile."},
  {t:"NY Guard service", d:"Jun 2024 – Jun 2027", y0:2024.45, y1:2027.5, cat:"mil", desc:"Enlisted June 2024. SPC 42A, HHC 27th IBCT. ETS June 2027."},
  {t:"Fort Jackson, SC", d:"BCT + AIT · Jan–May 2025", y0:2025.0, y1:2025.4, cat:"mil", desc:"Basic Combat Training + AIT at Fort Jackson, South Carolina."},
  {t:"Clarkson Campus Safety", d:"to Jul 2026", y0:2025.4, y1:2026.55, cat:"work", desc:"Campus Safety officer before moving internally."},
  {t:"Admin Coordinator", d:"from Jul 20, 2026", y0:2026.55, y1:2028.0, cat:"work", desc:"Administrative Coordinator, Lewis School of Health Sciences (PT + OT)."},
  {t:"Clarkson MBA", d:"Fall 2026 – Mar 2027", y0:2026.7, y1:2027.25, cat:"edu", desc:"General MBA at Clarkson."},
  {t:"Syracuse drill", d:"Oct 23–25, 2026", y:2026.81, cat:"mil", desc:"UTA drill, Thompson Rd Syracuse. Drive down Oct 22."},
  {t:"Air Force OTS board", d:"Jan 2027", y:2027.05, cat:"mil", desc:"OTS board 27OTS01R — the commission track."},
  {t:"Fort Drum AT", d:"Jul 14–28, 2027", y:2027.54, cat:"mil", desc:"FY27 annual training at Fort Drum."},
];
const legend=document.getElementById('legend');
Object.entries(CATS).forEach(([k,v])=>{
  legend.innerHTML+=`<span><i style="background:#${v.c.toString(16).padStart(6,'0')}"></i></span><span>${v.label}</span>`;
});

// scene
const app=document.getElementById('app');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x04060c);
scene.fog=new THREE.FogExp2(0x04060c,0.0016);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,2000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
app.appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
Object.assign(labelRenderer.domElement.style,{position:'absolute',top:'0',pointerEvents:'none'});
app.appendChild(labelRenderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.06; controls.maxDistance=320; controls.minDistance=12;

// lights — the sun at center
scene.add(new THREE.AmbientLight(0x8899bb,0.55));
const sunLight=new THREE.PointLight(0xffe6b0,900,400,1.8); scene.add(sunLight);
const rim=new THREE.DirectionalLight(0x5aa2ff,0.5); rim.position.set(-60,40,-30); scene.add(rim);

// stars
{
  const g=new THREE.BufferGeometry(), N=900, pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){ const r=380+Math.random()*320, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.cos(ph)*0.7; pos[i*3+2]=r*Math.sin(ph)*Math.sin(th); }
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xaFC4ff,size:1.4,sizeAttenuation:false,transparent:true,opacity:.7})));
}

// time -> radius
const Y0=2016, Y1=2028, R0=14, RGAP=7;
const yr2r=y=>R0+(y-Y0)*RGAP;
// year rings
for(let y=Y0;y<=Y1;y++){
  const r=yr2r(y), pts=[];
  for(let i=0;i<=128;i++){ const a=i/128*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r)); }
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:0x2a3450,transparent:true,opacity:.8}));
  scene.add(line);
  const el=document.createElement('div'); el.className='yr'; el.textContent=y;
  const o=new CSS2DObject(el); const a=Math.PI*0.72;
  o.position.set(Math.cos(a)*r,0,Math.sin(a)*r); scene.add(o);
}
// sun (JD)
{
  const sun=new THREE.Mesh(new THREE.SphereGeometry(2.6,32,32),
    new THREE.MeshStandardMaterial({color:0xf0b44c,emissive:0xf0b44c,emissiveIntensity:2.2}));
  scene.add(sun);
  const el=document.createElement('div'); el.className='lbl'; el.innerHTML='JD';
  const o=new CSS2DObject(el); o.position.set(0,4.2,0); scene.add(o);
}

const pickables=[], floaters=[];
function shapeFor(cat){
  const c=CATS[cat].c, s=CATS[cat].shape;
  let g;
  if(s==='box') g=new THREE.BoxGeometry(1.7,1.7,1.7);
  else if(s==='torus') g=new THREE.TorusGeometry(1.15,0.42,14,28);
  else if(s==='octa') g=new THREE.OctahedronGeometry(1.35);
  else if(s==='icosa') g=new THREE.IcosahedronGeometry(1.3);
  else g=new THREE.SphereGeometry(1.15,24,24);
  return new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.55,roughness:.35,metalness:.15}));
}
function tag(t,d,lift){
  const el=document.createElement('div'); el.className='lbl'; el.innerHTML=`${t}<small>${d}</small>`;
  const o=new CSS2DObject(el); o.position.y=lift; return o;
}
// golden-angle spread so neighbors don't collide
EV.forEach((e,i)=>{
  const a=i*2.39996+0.5, col=CATS[e.cat].c;
  const mesh=shapeFor(e.cat); mesh.userData.ev=e;
  if(e.y0!==undefined){ // duration -> arc beam through space
    const r0=yr2r(e.y0), r1=yr2r(e.y1), dur=e.y1-e.y0;
    const p0=new THREE.Vector3(Math.cos(a)*r0,0,Math.sin(a)*r0);
    const p1=new THREE.Vector3(Math.cos(a)*r1,0,Math.sin(a)*r1);
    const apex=Math.min(16,3+dur*3.2);
    const mid=p0.clone().add(p1).multiplyScalar(0.5); mid.y=apex;
    const curve=new THREE.QuadraticBezierCurve3(p0,mid,p1);
    const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,42,0.34,10),
      new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.9,roughness:.3,transparent:true,opacity:.92}));
    tube.userData.ev=e; scene.add(tube); pickables.push(tube);
    // endpoint nodes
    [p0,p1].forEach(p=>{ const cap=shapeFor(e.cat); cap.scale.setScalar(.62); cap.position.copy(p); cap.position.y=0.4;
      cap.userData.ev=e; scene.add(cap); pickables.push(cap); });
    const label=tag(e.t,e.d,apex+1.6); label.position.copy(mid); scene.add(label);
    e._focus=mid.clone();
  } else { // point event -> floating shape
    const r=yr2r(e.y);
    mesh.position.set(Math.cos(a)*r,2.2,Math.sin(a)*r);
    mesh.userData.baseY=2.2; mesh.userData.ph=Math.random()*6.28;
    scene.add(mesh); pickables.push(mesh); floaters.push(mesh);
    mesh.add(tag(e.t,e.d,2.4));
    e._focus=mesh.position.clone();
  }
});

// camera presets
function flyTo(pos,tgt,dur=1100){
  const p0=camera.position.clone(), t0=controls.target.clone(), p1=pos, t1=tgt, s=performance.now();
  (function step(n){ const k=Math.min(1,(n-s)/dur), e=1-Math.pow(1-k,3);
    camera.position.lerpVectors(p0,p1,e); controls.target.lerpVectors(t0,t1,e);
    if(k<1) requestAnimationFrame(step); })(s);
}
const b2d=document.getElementById('b2d'), b3d=document.getElementById('b3d');
function go2d(){ b2d.classList.add('on'); b3d.classList.remove('on');
  flyTo(new THREE.Vector3(0,150,0.5),new THREE.Vector3(0,0,0)); }
function go3d(){ b3d.classList.add('on'); b2d.classList.remove('on');
  flyTo(new THREE.Vector3(52,44,72),new THREE.Vector3(0,2,0)); }
b2d.onclick=go2d; b3d.onclick=go3d;
camera.position.set(52,44,72); controls.target.set(0,2,0);

// picking
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let sel=null;
function select(obj){
  if(sel) sel.scale.setScalar(sel.userData.s0||1);
  sel=obj;
  if(!obj){ card.classList.remove('show'); return; }
  obj.userData.s0=obj.scale.x; obj.scale.setScalar(obj.userData.s0*1.5);
  const e=obj.userData.ev, col='#'+CATS[e.cat].c.toString(16).padStart(6,'0');
  ccat.textContent=CATS[e.cat].label+' · '+CATS[e.cat].shape; ccat.style.color=col;
  ctitle.textContent=e.t; cwhen.textContent=e.d; cdesc.textContent=e.desc;
  card.classList.add('show');
  const f=e._focus||obj.position;
  flyTo(f.clone().add(new THREE.Vector3(14,10,18)),f.clone(),900);
}
renderer.domElement.addEventListener('click',ev=>{
  mouse.set(ev.clientX/innerWidth*2-1,-(ev.clientY/innerHeight)*2+1);
  ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(pickables,false)[0];
  select(hit?hit.object:null);
});
renderer.domElement.addEventListener('pointermove',ev=>{
  mouse.set(ev.clientX/innerWidth*2-1,-(ev.clientY/innerHeight)*2+1);
  ray.setFromCamera(mouse,camera);
  renderer.domElement.style.cursor=ray.intersectObjects(pickables,false).length?'pointer':'grab';
});

// loop
const clock=new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  const t=clock.getElapsedTime();
  floaters.forEach(m=>{ m.position.y=m.userData.baseY+Math.sin(t*0.9+m.userData.ph)*0.5; m.rotation.y+=0.004; m.rotation.x+=0.002; });
  controls.update(); renderer.render(scene,camera); labelRenderer.render(scene,camera);
})();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
