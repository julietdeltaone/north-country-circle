<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9eff4">
<title>Contacts Pro — Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script>try{var m=localStorage.getItem('ncc_theme_mode'),s=localStorage.getItem('ncc_theme_scheme');document.documentElement.setAttribute('data-mode',m==='dark'?'dark':'light');document.documentElement.setAttribute('data-scheme',['bluegreen','slate'].indexOf(s)>=0?s:'bluegreen');}catch(e){document.documentElement.setAttribute('data-mode','light');document.documentElement.setAttribute('data-scheme','bluegreen');}</script>
<style>
/* Contacts Pro Mobile — Clear Glass tokens mirrored from contacts-pro.css
   (same localStorage theme keys: ncc_theme_mode / ncc_theme_scheme). */
:root{
  --ga:#3a9bff; --gb:#2fbf71;
  color-scheme:light;
  --bg:rgba(255,255,255,.40); --bg2:rgba(255,255,255,.50);
  --card:rgba(255,255,255,.48); --card2:rgba(255,255,255,.66);
  --glass:rgba(255,255,255,.48); --glass2:rgba(255,255,255,.66);
  --glass-solid:rgba(250,251,252,.94); --card-grad:rgba(255,255,255,.66);
  --line:rgba(24,36,52,.13); --line2:rgba(24,36,52,.26);
  --txt:#0d131b; --txt2:#28323f; --mut:#3f4c5b; --dim:#47545f;
  --fill:rgba(18,28,40,.05); --fill2:rgba(18,28,40,.09); --fill3:rgba(18,28,40,.14);
  --acc:#e30613; --accbg:rgba(227,6,19,.10);
  --ok:#161c24; --warn:#b96e00; --bad:#c2433c;
  --edge-hi:rgba(255,255,255,.75);
  --scrim:rgba(24,36,52,.34);
  --field:#e9eff4;
  --sans:'Archivo',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --serif:'Space Grotesk','Archivo',system-ui,sans-serif;
  --sh:0 24px 44px -18px rgba(56,78,104,.28),0 10px 20px -10px rgba(56,78,104,.16),0 2px 5px -1px rgba(56,78,104,.12),inset 0 1px 0 rgba(255,255,255,.65),inset 0 0 22px rgba(255,255,255,.10);
  --sh-chip:0 3px 8px -3px rgba(56,78,104,.25);
  --d-press:.12s; --d-state:.16s; --d-enter:.24s;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-std:cubic-bezier(.2,0,0,1);
}
html[data-scheme="slate"]{--ga:#64748b;--gb:#94a3b8}
html[data-mode="dark"]{
  color-scheme:dark;
  --bg:rgba(13,16,21,.46); --bg2:rgba(16,19,25,.54);
  --card:rgba(19,22,29,.50); --card2:rgba(26,30,38,.62);
  --glass:rgba(19,22,29,.50); --glass2:rgba(26,30,38,.62);
  --glass-solid:rgba(13,15,19,.94); --card-grad:rgba(26,30,38,.62);
  --line:rgba(255,255,255,.13); --line2:rgba(255,255,255,.26);
  --txt:#f4f6f8; --txt2:#ccd3da; --mut:#a7aeb8; --dim:#8a939e;
  --fill:rgba(255,255,255,.05); --fill2:rgba(255,255,255,.09); --fill3:rgba(255,255,255,.15);
  --accbg:rgba(227,6,19,.16);
  --ok:#f2f2f2; --warn:#e0a35a; --bad:#e0766f;
  --edge-hi:rgba(255,255,255,.16);
  --scrim:rgba(2,4,8,.55);
  --field:#0a0e13;
  --sh:0 24px 44px -18px rgba(0,0,0,.60),0 10px 20px -10px rgba(0,0,0,.45),0 2px 5px -1px rgba(0,0,0,.40),inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 22px rgba(255,255,255,.03);
  --sh-chip:0 3px 8px -3px rgba(0,0,0,.5);
}
/* ---------- sturdiness shell: never sideways, ever ---------- */
*{box-sizing:border-box;max-width:100%}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;background:transparent}
/* The app's base paint lives on the ROOT element too (JD 2026-10-30: a hard
   white void cut the list mid-row in Chrome iOS — the page layer painted
   shorter than the webview and the bare canvas showed through). The root
   background is painted by the browser across the whole canvas no matter
   how any element is sized, so the bottom of the screen can never be white. */
html{background:
  radial-gradient(1100px 700px at -6% -10%,color-mix(in srgb,var(--ga) 52%,transparent),transparent 64%),
  radial-gradient(1200px 820px at 106% 112%,color-mix(in srgb,var(--gb) 46%,transparent),transparent 64%),
  radial-gradient(760px 520px at 88% -12%,color-mix(in srgb,var(--gb) 20%,transparent),transparent 60%),
  radial-gradient(120% 90% at 50% 42%,transparent 55%,rgba(31,48,71,.16) 100%),
  linear-gradient(155deg,color-mix(in srgb,var(--ga) 13%,var(--field)),color-mix(in srgb,var(--gb) 11%,var(--field)))}
html[data-mode="dark"]{background:
  radial-gradient(1100px 700px at -6% -10%,color-mix(in srgb,var(--ga) 58%,transparent),transparent 64%),
  radial-gradient(1200px 820px at 106% 112%,color-mix(in srgb,var(--gb) 52%,transparent),transparent 64%),
  radial-gradient(760px 520px at 88% -12%,color-mix(in srgb,var(--gb) 24%,transparent),transparent 60%),
  radial-gradient(120% 90% at 50% 42%,transparent 55%,rgba(0,0,0,.42) 100%),
  linear-gradient(155deg,color-mix(in srgb,var(--ga) 14%,var(--field)),color-mix(in srgb,var(--gb) 12%,var(--field)))}
body{font:15px/1.5 var(--sans);color:var(--txt);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(1100px 700px at -6% -10%,color-mix(in srgb,var(--ga) 52%,transparent),transparent 64%),
  radial-gradient(1200px 820px at 106% 112%,color-mix(in srgb,var(--gb) 46%,transparent),transparent 64%),
  radial-gradient(760px 520px at 88% -12%,color-mix(in srgb,var(--gb) 20%,transparent),transparent 60%),
  radial-gradient(120% 90% at 50% 42%,transparent 55%,rgba(31,48,71,.16) 100%),
  linear-gradient(155deg,color-mix(in srgb,var(--ga) 13%,var(--field)),color-mix(in srgb,var(--gb) 11%,var(--field)))}
html[data-mode="dark"] body::before{background:
  radial-gradient(1100px 700px at -6% -10%,color-mix(in srgb,var(--ga) 58%,transparent),transparent 64%),
  radial-gradient(1200px 820px at 106% 112%,color-mix(in srgb,var(--gb) 52%,transparent),transparent 64%),
  radial-gradient(760px 520px at 88% -12%,color-mix(in srgb,var(--gb) 24%,transparent),transparent 60%),
  radial-gradient(120% 90% at 50% 42%,transparent 55%,rgba(0,0,0,.42) 100%),
  linear-gradient(155deg,color-mix(in srgb,var(--ga) 14%,var(--field)),color-mix(in srgb,var(--gb) 12%,var(--field)))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
a{touch-action:manipulation}
:focus-visible{outline:2px solid var(--ga);outline-offset:2px}
h1,h2,h3,p{margin:0}
img{max-width:100%}
/* fixed shell, inset 0: tracks the visible viewport in mobile browsers
   (Chrome iOS especially) far more reliably than 100dvh, which is what let
   the shell end short and expose the white canvas in the first place */
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;overflow-x:hidden}
/* ---------- header ---------- */
#hdr{flex:none;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(180deg,var(--glass2),var(--glass));-webkit-backdrop-filter:blur(22px) saturate(185%);backdrop-filter:blur(22px) saturate(185%);border-bottom:1px solid var(--line);z-index:40}
#hdr .brand{display:flex;align-items:center;gap:8px;font:600 15px var(--serif);letter-spacing:.2px;color:var(--txt);min-width:0}
#hdr .brand i{width:9px;height:9px;border-radius:50%;background:var(--acc);flex:none}
#hdr .brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr .ver{font-size:10.5px;font-weight:600;letter-spacing:.12em;color:var(--mut);white-space:nowrap}
.sp{flex:1}
.syncp{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--mut);white-space:nowrap;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.syncp i{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.syncp.busy i{background:var(--warn)}
.syncp.err{color:var(--bad);border-color:rgba(224,118,111,.45)}
.syncp.err i{background:var(--bad)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;color:var(--mut);flex:none}
.ib:active{background:var(--fill2);color:var(--txt)}
/* ---------- scroll region ---------- */
#scroll{flex:1;overflow-y:auto;scroll-padding-top:4px;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:relative;scrollbar-width:thin}
.view{padding:12px 16px 30px;max-width:640px;margin:0 auto;width:100%}
/* ---------- select screen control deck: fixed, solid, never overlapped ---------- */
#deck{flex:none;position:relative;z-index:30;display:flex;flex-direction:column;gap:8px;padding:10px 16px 11px;background:linear-gradient(180deg,var(--glass-solid),var(--glass2));-webkit-backdrop-filter:blur(22px) saturate(185%);backdrop-filter:blur(22px) saturate(185%);border-bottom:1px solid var(--line2);box-shadow:0 14px 24px -18px rgba(56,78,104,.45)}
#deck[hidden]{display:none}
html[data-mode="dark"] #deck{box-shadow:0 14px 24px -18px rgba(0,0,0,.75)}
.searchwrap{position:relative;display:flex;align-items:center}
.searchwrap>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none;flex:none}
#q,#pq{width:100%;height:52px;padding:0 44px 0 40px;border-radius:16px;border:1px solid var(--line2);background:var(--glass-solid);outline:none;font-size:16px;color:var(--txt)}
#q:focus,#pq:focus{border-color:var(--ga)}
#q::-webkit-search-cancel-button,#pq::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
#qclear,#pqclear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:none;align-items:center;justify-content:center;color:var(--mut);border-radius:10px;background:none;border:none}
.lhead{position:sticky;top:0;z-index:20;transform:translateZ(0);font:700 12px var(--sans);letter-spacing:.14em;color:var(--txt2);padding:7px 10px;margin:10px 0 4px;border-radius:10px;background:linear-gradient(90deg,color-mix(in srgb,var(--ga) 16%,var(--field)),color-mix(in srgb,var(--gb) 12%,var(--field)));border:1px solid var(--line);scroll-margin-top:0}
.lsec:first-child .lhead{margin-top:2px}
#plist{padding-bottom:52px}
#plist.railpad{padding-right:40px}
.prow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:12px 8px;min-height:68px;border-radius:14px;position:relative}
.prow::after{content:"";position:absolute;left:67px;right:2px;bottom:0;height:1px;background:var(--line)}
.prow:active{background:var(--fill2)}
.av{display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:50%;font-weight:600;overflow:hidden;background:linear-gradient(150deg,color-mix(in srgb,var(--ga) 26%,var(--glass2)),color-mix(in srgb,var(--gb) 22%,var(--glass)));border:1px solid var(--line);color:var(--txt)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av-sm{width:46px;height:46px;font-size:15px}
.av-lg{width:60px;height:60px;font-size:21px;font-family:var(--serif)}
.prow .pmain{flex:1;min-width:0}
.prow b{display:block;font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow small{display:block;color:var(--mut);font-size:12.5px;line-height:1.3;white-space:normal;overflow-wrap:break-word}
.prow .chev{color:var(--dim);flex:none}
#rail{position:absolute;right:0;top:180px;bottom:150px;width:36px;display:none;flex-direction:column;align-items:center;justify-content:flex-start;gap:0;z-index:30;padding:2px 0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#rail.on{display:flex}
#rail button{flex:1;width:100%;min-height:13px;font-size:10.5px;font-weight:700;color:var(--mut);display:flex;align-items:center;justify-content:center;border-radius:6px;padding-right:4px}
#rail button:active,#rail button.hit{background:var(--acc);color:#fff}
#rail button.off{opacity:.28}
#scrubbub{position:fixed;right:54px;top:0;width:70px;height:70px;margin-top:-35px;border-radius:22px;background:var(--glass-solid);border:1px solid var(--line2);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;font:700 36px var(--serif);color:var(--txt);z-index:60;opacity:0;pointer-events:none;transition:opacity var(--d-press) var(--ease-out)}
#scrubbub.on{opacity:1}
#totop{position:absolute;right:14px;bottom:14px;z-index:35;width:44px;height:44px;border-radius:50%;display:none;align-items:center;justify-content:center;background:var(--glass-solid);border:1px solid var(--line2);box-shadow:var(--sh-chip);color:var(--txt)}
#totop.on{display:inline-flex}
.empty{padding:44px 18px;text-align:center;color:var(--mut)}
.empty h3{font:500 19px var(--serif);color:var(--txt);margin-bottom:6px}
/* ---------- home: two hero doors + recents (JD 2026-10-30) ---------- */
.heroes{display:flex;flex-direction:column;gap:12px}
.hero-btn{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;min-height:24vh;width:100%;padding:22px;border-radius:22px;border:1px solid var(--line2);text-align:left;color:var(--txt);box-shadow:var(--sh);-webkit-backdrop-filter:blur(22px) saturate(185%);backdrop-filter:blur(22px) saturate(185%)}
.hero-btn:active{transform:scale(.99)}
.hero-btn .hb-ic{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:16px;background:var(--glass-solid);border:1px solid var(--line2);color:var(--txt)}
.hero-btn b{font:700 31px/1.05 var(--serif);letter-spacing:-.3px}
.hero-btn small{font-size:14.5px;color:var(--mut);font-weight:500}
.hb-online{background:linear-gradient(150deg,color-mix(in srgb,var(--ga) 34%,var(--glass2)),color-mix(in srgb,var(--gb) 26%,var(--glass)))}
.hb-loc{background:linear-gradient(150deg,color-mix(in srgb,var(--acc) 20%,var(--glass2)),var(--glass))}
.seg2{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--fill);border:1px solid var(--line)}
.seg2 button{flex:1;min-height:40px;border-radius:9px;color:var(--mut);font-weight:700;font-size:14px}
.seg2 button.on{background:var(--acc);color:#fff}
.scopeline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);font-weight:600}
.scopeline button{margin-left:auto;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);color:var(--txt);font-weight:700;font-size:13px;background:var(--glass);flex:none}
/* ---------- contact page ---------- */
.backrow{display:flex;align-items:center;gap:4px;margin-bottom:10px}
.backbtn{display:inline-flex;align-items:center;gap:2px;min-height:40px;padding:0 10px 0 4px;color:var(--txt);font-weight:600;border-radius:12px}
.hero{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:linear-gradient(180deg,var(--glass2),var(--glass));-webkit-backdrop-filter:blur(22px) saturate(185%);backdrop-filter:blur(22px) saturate(185%);border:1px solid var(--line);box-shadow:var(--sh)}
.hero h1{font:600 22px/1.15 var(--serif);letter-spacing:-.2px;overflow-wrap:anywhere}
.hero .hloc{color:var(--txt2);font-size:13.5px;margin-top:3px;display:flex;align-items:center;gap:5px}
.hero .hsub{color:var(--mut);font-size:13.5px;margin-top:2px}
.hero .hlc{color:var(--mut);font-size:12.5px;margin-top:5px}
.hero .hlc b{color:var(--txt)}
.glasscard{margin-top:12px;padding:14px;border-radius:16px;background:linear-gradient(180deg,var(--glass2),var(--glass));-webkit-backdrop-filter:blur(22px) saturate(185%);backdrop-filter:blur(22px) saturate(185%);border:1px solid var(--line);box-shadow:var(--sh)}
.glasscard h2{font:700 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--txt);margin-bottom:10px}
.qa-grid{display:flex;flex-direction:column;gap:8px;min-width:0}
.qa-item{border:1px solid var(--line);border-radius:12px;background:var(--glass);overflow:hidden;min-width:0}
.qa-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:50px;padding:10px 12px;color:var(--txt);font-weight:600}
.qa-btn small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.qa-btn .chev{margin-left:auto;color:var(--dim);flex:none;transition:transform var(--d-state) var(--ease-std)}
.qa-item.open .qa-btn .chev{transform:rotate(90deg)}
.qa-form{border-top:1px solid var(--line);padding:12px;min-width:0}
.qa-form[hidden]{display:none}
.qa-form .btn{margin-top:12px}
.lab{display:block;margin:10px 0 5px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.lab:first-child{margin-top:0}
input[type="date"],input[type="text"],textarea,select.inp{width:100%;min-width:0;min-height:44px;padding:9px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--glass-solid);outline:none;font-size:16px}
input[type="date"]{display:block}
textarea{resize:vertical;line-height:1.5;min-height:76px}
input:focus,textarea:focus,select.inp:focus{border-color:var(--ga)}
.tog{display:flex;align-items:center;gap:12px;min-height:54px;padding:6px 2px;color:var(--txt);font-size:15.5px;font-weight:600}
.tog input{width:27px;height:27px;accent-color:var(--acc);flex:none}
.btn.big{min-height:58px;font-size:16.5px;border-radius:14px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:var(--glass2);font-weight:600;width:100%}
.btn.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.primary:active{background:#c4050f}
.btn:disabled{opacity:.45}
.savestat{font-size:13px;margin-top:9px;min-height:18px;color:var(--mut)}
.savestat.ok{color:var(--txt);font-weight:600}
.savestat.err{color:var(--bad)}
/* collapsed sections */
.sec{margin-top:12px;border-radius:16px;background:linear-gradient(180deg,var(--glass2),var(--glass));-webkit-backdrop-filter:blur(22px) saturate(185%);backdrop-filter:blur(22px) saturate(185%);border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden}
.sec-h{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:12px 14px;text-align:left;color:var(--txt)}
.sec-h b{font:700 11.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;flex:1;min-width:0}
.sec-h .cnt{font-size:12px;color:var(--mut);font-weight:600}
.sec-h .chev{color:var(--dim);flex:none;transition:transform var(--d-state) var(--ease-std)}
.sec.open .sec-h .chev{transform:rotate(180deg)}
.sec-body{padding:2px 14px 14px;display:none}
.sec.open .sec-body{display:block}
.kv{display:grid;grid-template-columns:104px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--mut)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv a{color:var(--txt);text-decoration:underline;text-underline-offset:2px}
.prose{font-size:14.5px;color:var(--txt2);white-space:pre-wrap;overflow-wrap:anywhere}
.prose + .prose{margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;padding:4px 11px;border-radius:999px;background:var(--glass);border:1px solid var(--line);color:var(--txt2);max-width:100%}
button.chip:active{border-color:var(--acc)}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 14px 12px}
.tl li::before{content:"";position:absolute;left:-20.5px;top:5px;width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--ga),var(--gb))}
.tl .td{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.04em}
.tl .ts{font-weight:600;font-size:14.5px}
.tl .tdet{color:var(--mut);font-size:13.5px;overflow-wrap:anywhere}
.tag{display:inline-block;font:700 9.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--mut);vertical-align:2px;margin-left:6px}
.photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photogrid figure{margin:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1;background:var(--fill)}
.photogrid img{width:100%;height:100%;object-fit:cover;display:block}
.none{color:var(--mut);font-size:14px}
/* groups + lists */
.grow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:52px;padding:11px 12px;border-radius:14px}
.grow:active{background:var(--fill2)}

<div id="toasts" aria-live="polite"></div>
<script>
(function(){
'use strict';
/* Contacts Pro Mobile v1 — a phone-first front end over the SAME data and
   the SAME save path as contacts-pro.js:
   - data: fetch('data/dossier.json') baked snapshot (same as boot())
   - identity: pkey(e) copied verbatim from contacts-pro.js
   - saves: queuePatch -> localStorage outbox 'ncc_outbox_v2' -> batched POST
     {password, kind:'batch', id:'batch', patch:{items:[{id, patch}]}} to the
     same Apps Script endpoint, password from localStorage 'ncc_edit_key'.
   Because both pages share an origin, the outbox, the local-wins overlay
   ('ncc_local_wins') and the edit key are literally the same stores the
   main app uses — a save made here is indistinguishable from one made there. */
var MOBILE_VERSION = '1.6.1';
var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwZli1Dv07iWBpR3Oz4jD4imtNLN845jFDBnXIbtmT3sPGExsMlKFMQwt42FmrUdFBD/exec';
var OUT_KEY = 'ncc_outbox_v2';
var WINS_KEY = 'ncc_local_wins';
var WINS_TTL = 7 * 24 * 3600 * 1000;
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){} return null; }
function cap(s){ s = String(s || ''); return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
function tagList(v){ return String(v || '').split(',').map(function(x){ return x.trim(); }).filter(Boolean); }
function parseArr(v){
  if(Array.isArray(v)) return v;
  var str = String(v || '').trim();
  if(!str) return [];
  try{ var a = JSON.parse(str); if(Array.isArray(a)) return a; }catch(x){}
  return [];
}
function todayStr(){ var t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); }
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(v){
  var m = String(v || '').match(/^(\d{4})(?:-(\d{2})(?:-(\d{2}))?)?/);
  if(!m) return String(v || '');
  if(m[3]) return MON[parseInt(m[2], 10) - 1] + ' ' + parseInt(m[3], 10) + ', ' + m[1];
  if(m[2]) return MON[parseInt(m[2], 10) - 1] + ' ' + m[1];
  return m[1];
}
/* flexible date sort key for last_contact grammar: YYYY | YYYY-MM | YYYY-MM-DD */
function flexKey(v){
  var m = String(v || '').trim().match(/^(\d{4})(?:-(\d{1,2}))?(?:-(\d{1,2}))?/);
  if(!m) return '';
  return m[1] + '-' + String(m[2] || '01').padStart(2, '0') + '-' + String(m[3] || '01').padStart(2, '0');
}

/* ---------- data access — mirrored from contacts-pro.js ---------- */
var D = null, BYN = {}, PK2I = {}, VER = 0;
function dispName(e){
  var pr = e.profile || {};
  var fn = (pr.first_name || '').trim(), ln = (pr.last_name || '').trim();
  if(fn || ln) return (fn + ' ' + ln).trim();
  return e.display || e.name || '';
}
function pkey(e){
  var n = String(e.name || '');
  if(/^(ig|ct|sf|fdb):/.test(n)) return n;
  if(e.src === 'contacts') return 'ct:' + n.toLowerCase();
  if(e.src === 'subject') return 'sf:' + ((e.record && e.record.slug) || n);
  return 'ig:' + n.toLowerCase();
}
function gv(e, k){
  var p = e.profile || {}, v = p[k];
  var edited = !!(e._set && e._set[k]);
  if(!edited && (v === undefined || v === null || v === '')){
    v = e[k];
    if(v === undefined || v === null || typeof v === 'object') v = (e.friendsdb || {})[k];
    if((v === undefined || v === null || v === '') && k === 'phone') v = ((e.contact || {}).phones || []).join(', ');
    if((v === undefined || v === null || v === '') && k === 'email') v = ((e.contact || {}).emails || []).join(', ');
  }
  return (v === undefined || v === null || typeof v === 'object') ? '' : String(v);
}
function raw(e, k){ var v = (e.profile || {})[k]; return v == null ? '' : String(v); }
function liveEntry(e){ var p = e.profile || {}; return p.deleted !== '1' && p.audit !== 'trash' && !(p.merged_into || '').trim(); }
function isListed(e){ return liveEntry(e) && (e.has_graph !== false || (e.events || []).length || (e.files || []).length || !!e.record || !!(((e.profile || {}).display_name || e.display || '') + '').trim()); }
function normEntry(r){
  var p = r.profile || {};
  var pe = parseArr(p.events), pf = parseArr(p.files);
  r.events = pe.length ? pe : (Array.isArray(r.events) ? r.events : []);
  r.files = pf.length ? pf : (Array.isArray(r.files) ? r.files : []);
}
var PEOPLE_CACHE = { ver:-1, list:[] };
function people(){
  if(PEOPLE_CACHE.ver === VER) return PEOPLE_CACHE.list;
  var out = [];
  D.directory.forEach(function(e, di){ if(isListed(e)) out.push(di); });
  PEOPLE_CACHE = { ver:VER, list:out };
  return out;
}
function diFromId(id){
  id = decodeURIComponent(id || '');
  if(PK2I[id] != null) return PK2I[id];
  if(PK2I['ig:' + id.toLowerCase()] != null) return PK2I['ig:' + id.toLowerCase()];
  return null;
}
function personGroups(e){ return tagList(gv(e, 'groups')); }
function knownAssociates(e){
  var hide = {}; tagList(raw(e, 'close_hide')).forEach(function(x){ hide[x.toLowerCase()] = 1; });
  var seen = {}, out = [];
  (e.neighbors || []).forEach(function(nb){
    var k = (nb.u || '').toLowerCase();
    if(k && !seen[k] && !hide[k]){ seen[k] = 1; out.push({ u:nb.u, d:nb.d }); }
  });
  tagList(raw(e, 'close_add')).forEach(function(a){
    var k = a.toLowerCase();
    if(k && !seen[k]){ seen[k] = 1; var di = BYN[k]; out.push({ u:a, d:di != null ? dispName(D.directory[di]) : a }); }
  });
  return out;
}
function lcNote(e){ return String(gv(e, 'lima_charlie_notes') || ''); }
function lcOnline(e){ return String(gv(e, 'last_contact_online') || '').trim().toLowerCase() === 'yes'; }
function initials(name){
  var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '?';
  return (parts[0].charAt(0) + (parts.length > 1 ? parts[parts.length - 1].charAt(0) : '')).toUpperCase();
}
/* photos sidecar (data/photos.json), keyed by display name like the main app */
var PHOTOS = null, PHOTO_BY_NAME = {};
function loadPhotos(){
  if(PHOTOS) return Promise.resolve();
  return fetch('data/photos.json', { cache:'no-cache' }).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
    PHOTOS = j || { people:[] };
    (PHOTOS.people || []).forEach(function(p){ if(p && p.name) PHOTO_BY_NAME[String(p.name).trim().toLowerCase()] = p; });
  }).catch(function(){ PHOTOS = { people:[] }; });
}
function photoURLs(e){
  var out = [], seen = {};
  function add(u){ u = String(u || '').trim(); if(u && !seen[u]){ seen[u] = 1; out.push(u); } }
  var pp = String(gv(e, 'primary_photo') || '').trim(); if(pp) add(pp);
  var rec = PHOTO_BY_NAME[dispName(e).toLowerCase()];
  if(rec){ add(rec.photo_url); (rec.also || []).forEach(function(a){ add(typeof a === 'string' ? a : (a && a.url) || (a && a.photo_url)); }); }
  var hid = {}; parseArr(gv(e, 'photo_hidden')).forEach(function(u){ hid[String(u)] = 1; });
  return out.filter(function(u){ return !hid[u]; });
}

/* ---------- outbox — mirrored from contacts-pro.js ---------- */
var OUT = { items:[], busy:false, timer:null, retry:0, err:'', auth:false, kickedAt:0 };
function getPw(){ return store('ncc_edit_key') || ''; }
function outLoad(){
  var a = [];
  try{ a = JSON.parse(localStorage.getItem(OUT_KEY) || '[]'); }catch(x){ a = []; }
  OUT.items = Array.isArray(a) ? a.filter(function(it){ return it && it.id; }) : [];
  OUT.items.forEach(function(it){
    it.patch = it.patch || {};
    if(it.sending){ it.patch = Object.assign({}, it.sending, it.patch); it.sending = null; }
  });
}
function outSave(){ try{ localStorage.setItem(OUT_KEY, JSON.stringify(OUT.items)); }catch(x){} }
function outPending(){ return OUT.items.filter(function(it){ return Object.keys(it.patch || {}).length || it.sending; }).length; }
/* local-wins overlay — same store + shape as the main app */
var WINS = {};
function winsLoad(){ try{ WINS = JSON.parse(localStorage.getItem(WINS_KEY) || '{}') || {}; }catch(x){ WINS = {}; } if(!WINS || typeof WINS !== 'object' || Array.isArray(WINS)) WINS = {}; winsPrune(); }
function winsSave(){ try{ localStorage.setItem(WINS_KEY, JSON.stringify(WINS)); }catch(x){} }
function winsPrune(){
  var cut = Date.now() - WINS_TTL, dirty = false;
  Object.keys(WINS).forEach(function(k){
    var f = WINS[k] || {};
    Object.keys(f).forEach(function(kk){ if(!f[kk] || !f[kk].t || f[kk].t < cut){ delete f[kk]; dirty = true; } });
    if(!Object.keys(f).length){ delete WINS[k]; dirty = true; }
  });
  if(dirty) winsSave();
}
function winsEq(a, b){ return String(a == null ? '' : a).trim().toLowerCase() === String(b == null ? '' : b).trim().toLowerCase(); }
function winsNote(key, patch){
  if(!key || !patch) return;
  var f = WINS[key] || (WINS[key] = {}), t = Date.now();
  Object.keys(patch).forEach(function(k){ f[k] = { v:patch[k], t:t }; });
  winsSave();
}
function normPatch(p){
  var o = {};
  Object.keys(p).forEach(function(k){ o[k] = p[k] == null ? '' : String(p[k]); });
  if(o.display_name) o.display = o.display_name;
  return o;
}
function applyProfileEdit(e, ch){
  e.profile = e.profile || {}; e._set = e._set || {};
  Object.keys(ch).forEach(function(k){
    var v = ch[k];
    e.profile[k] = v; e._set[k] = 1;
    if(k === 'events') e.events = parseArr(v);
    else if(k === 'files') e.files = parseArr(v);
  });
  if(ch.display) e.display = ch.display;
  else if(ch.display_name) e.display = ch.display_name;
  VER++;
}
/* save listeners: each quick-entry form registers for its own patches */
var SAVE_WATCH = [];
function watchSave(id, fields, cb){ SAVE_WATCH.push({ id:id, fields:fields, cb:cb }); }
function fireSaved(id, sending){
  SAVE_WATCH = SAVE_WATCH.filter(function(w){
    if(w.id !== id) return true;
    var hit = w.fields.some(function(k){ return k in sending; });
    if(hit){ try{ w.cb(); }catch(x){} return false; }
    return true;
  });
}
/* every write goes through here — same choke point as the main app */
function queuePatch(idx, patch){
  var e = D.directory[idx]; if(!e) return;
  patch = normPatch(patch);
  applyProfileEdit(e, patch);
  var key = pkey(e), it = null;
  for(var i = 0; i < OUT.items.length; i++) if(OUT.items[i].id === key){ it = OUT.items[i]; break; }
  if(!it){ it = { id:key, patch:{}, sending:null }; OUT.items.push(it); }
  Object.keys(patch).forEach(function(k){ it.patch[k] = patch[k]; });
  winsNote(key, patch);
  outSave(); paintSync();
  clearTimeout(OUT.timer); OUT.timer = setTimeout(outKick, 700);
}
function setField(di, k, v){
  var e = D.directory[di]; if(!e) return;
  v = String(v == null ? '' : v);
  if(gv(e, k) === v) return;
  var p = {}; p[k] = v; queuePatch(di, p);
}
function outFailItem(it, msg){
  it.patch = Object.assign({}, it.sending || {}, it.patch);
  it.sending = null;
  it.tries = (it.tries || 0) + 1;
  it.err = msg;
  if(it.tries >= 5) it.stuck = msg;
}
function outKick(){
  clearTimeout(OUT.timer);
  if(OUT.busy || OUT.auth) return;
  var batch = [];
  OUT.items.forEach(function(it){
    if(batch.length < 25 && !it.stuck && Object.keys(it.patch).length){ it.sending = it.patch; it.patch = {}; batch.push(it); }
  });
  if(!batch.length){ OUT.items = OUT.items.filter(function(it){ return Object.keys(it.patch).length || it.sending || it.stuck; }); outSave(); paintSync(); return; }
  OUT.busy = true; OUT.kickedAt = Date.now(); outSave(); paintSync();
  var opts = { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body:JSON.stringify({ password:getPw(), kind:'batch', id:'batch', patch:{ items:batch.map(function(it){ return { id:it.id, patch:it.sending }; }) } }) };
  fetch(WEBAPP_URL, opts).then(function(r){ return r.json(); }).then(function(res){
    if(!res) throw new Error('empty response');
    var results = res.results || null;
    if(!res.ok && !results) throw new Error(res.error || 'unknown');
    var failed = 0;
    batch.forEach(function(it, i){
      var r = results ? (results[i] || {}) : {};
      var itemOk = res.ok ? true : (r.ok === true);
      if(!itemOk){ failed++; outFailItem(it, r.error || res.error || 'rejected by the sheet'); return; }
      var sending = it.sending || {};
      it.tries = 0; it.stuck = ''; it.err = ''; it.sending = null;
      fireSaved(it.id, sending);
    });
    OUT.busy = false;
    if(failed){ OUT.err = res.error || 'some changes were rejected'; if(/unauthorized/i.test(OUT.err)){ OUT.auth = true; paintSync(); toast('The Sheet rejected the save — an edit key is needed. Open the menu on the full site to set it, or enter it below a save form.'); } }
    else { OUT.retry = 0; OUT.err = ''; }
    OUT.items = OUT.items.filter(function(it){ return Object.keys(it.patch).length || it.sending || it.stuck; });
    outSave(); paintSync();
    if(OUT.items.length) outKick();
  }).catch(function(err){
    OUT.busy = false;
    var msg = String(err && err.message || err);
    batch.forEach(function(it){ outFailItem(it, msg); });
    OUT.retry++; OUT.err = msg; outSave(); paintSync();
    if(/unauthorized/i.test(msg)){ OUT.auth = true; return; }
    if(OUT.items.some(function(it){ return !it.stuck && Object.keys(it.patch).length; }))
      OUT.timer = setTimeout(outKick, Math.min(30000, 2000 * Math.pow(2, OUT.retry - 1)));
  });
}
addEventListener('online', function(){ OUT.retry = 0; outKick(); });
addEventListener('pagehide', function(){
  if(!outPending() || !navigator.sendBeacon) return;
  var items = OUT.items.map(function(it){ return { id:it.id, patch:Object.assign({}, it.sending || {}, it.patch || {}) }; })
    .filter(function(it){ return Object.keys(it.patch).length; });
  if(!items.length) return;
  try{ navigator.sendBeacon(WEBAPP_URL, new Blob([JSON.stringify({ password:getPw(), kind:'batch', id:'batch', patch:{ items:items } })], { type:'text/plain;charset=utf-8' })); }catch(x){}
});
function applyOutbox(){
  OUT.items.forEach(function(it){
    var di = PK2I[it.id]; if(di === undefined) return;
    applyProfileEdit(D.directory[di], Object.assign({}, it.sending || {}, it.patch));
  });
}
function winsApplyAll(){
  Object.keys(WINS).forEach(function(k){
    var di = PK2I[k]; if(di === undefined) return;
    var e = D.directory[di], f = WINS[k], ch = null;
    Object.keys(f).forEach(function(kk){ if(!winsEq((e.profile || {})[kk], f[kk].v)){ (ch = ch || {})[kk] = f[kk].v; } });
    if(ch) applyProfileEdit(e, ch);
  });
}
function paintSync(){
  var p = $('#syncp'), t = $('#synctxt'); if(!p || !t) return;
  var n = outPending(), stuck = OUT.items.filter(function(it){ return it.stuck; }).length;
  p.classList.toggle('busy', OUT.busy || n > 0);
  p.classList.toggle('err', !!OUT.err || stuck > 0);
  t.textContent = OUT.busy ? 'Saving…' : (stuck ? 'Save stuck' : (n ? n + ' queued' : (OUT.err ? 'Save failed' : 'Saved')));
}
$('#syncp').addEventListener('click', function(){
  if(OUT.auth){ var k = prompt('Edit key (stored in this browser only):', ''); if(k != null){ store('ncc_edit_key', k.trim()); OUT.auth = false; OUT.err = ''; OUT.items.forEach(function(it){ it.stuck = ''; it.tries = 0; }); paintSync(); outKick(); } return; }
  if(outPending() || OUT.err){ OUT.items.forEach(function(it){ it.stuck = ''; }); OUT.err = ''; outKick(); toast('Retrying the save…'); }
  else toast('Everything is written to the Sheet.');
});
function toast(msg){
  var box = $('#toasts'), el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  box.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add('show'); });
  setTimeout(function(){ el.classList.remove('show'); setTimeout(function(){ el.remove(); }, 300); }, 3400);
}

/* ---------- shared bits ---------- */
var CHEV = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
var CHEVD = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
function avatarHTML(e, cls){
  return '<span class="av ' + cls + '" aria-hidden="true">' + esc(initials(dispName(e))) + '</span>';
}
function subLine(e){
  var bits = [];
  var loc = gv(e, 'location_on_file') || gv(e, 'city');
  if(loc) bits.push(loc);
  var rel = gv(e, 'relationship'); if(rel) bits.push(cap(rel));
  var lc = gv(e, 'last_contact'); if(lc) bits.push('Last contact ' + fmtDate(lc) + (lcOnline(e) ? ' · online' : ''));
  if(!bits.length){ var h = String(e.name || ''); if(h && !/^(ig|ct|sf|fdb):/.test(h)) bits.push('@' + h); }
  return bits.join(' · ');
}
function personRow(di, attr){
  var e = D.directory[di];
  return '<button type="button" class="prow" ' + (attr || 'data-open') + '="' + di + '">' + avatarHTML(e, 'av-sm') +
    '<span class="pmain"><b>' + esc(dispName(e)) + '</b><small>' + esc(subLine(e)) + '</small></span>' + CHEV + '</button>';
}
function matchesQ(di, q){
  var e = D.directory[di];
  var hay = [dispName(e), e.name || '', gv(e, 'location_on_file'), gv(e, 'phone'), gv(e, 'email'),
    tagList(gv(e, 'groups')).join(' '), tagList(gv(e, 'companies')).join(' '),
    tagList(gv(e, 'churches')).join(' '), tagList(gv(e, 'universities')).join(' '), gv(e, 'specialty')].join(' ').toLowerCase();
  return q.split(/\s+/).every(function(w){ return hay.indexOf(w) >= 0; });
}
/* the one logging write, shared by the profile form and both home flows:
   a Timeline contact entry dated today + the Last Contact stamp (with the
   online flag) when it is the newest — same rule as the main app */
function saveLog(di, sum, det, on){
  var e = D.directory[di]; if(!e) return false;
  sum = String(sum || '').trim(); if(!sum) return false;
  det = String(det || '').trim();
  var d = todayStr();
  var arr = (e.events || []).slice();
  var lev = { date:d, summary:sum, kind:'contact' };
  if(det) lev.detail = det;
  if(on) lev.online = true;
  arr.push(lev);
  queuePatch(di, { events:JSON.stringify(arr) });
  var curLc = String(gv(e, 'last_contact') || '').trim();
  if(!curLc || flexKey(d) >= flexKey(curLc)){ setField(di, 'last_contact', d); setField(di, 'last_contact_online', on ? 'yes' : ''); }
  return true;
}

/* ---------- scroll memory — the desktop app's NAVS rule (V3.40.0),
   mirrored for this shell: Back returns to the previous view actually
   seen, at the scroll it was left at. Mobile has ONE scroll region
   (#scroll) shared by every view, so positions live in a per-route map.
   render() used to zero the scroll on every route change, which is why
   opening a profile and coming back dumped you at the top of the list. */
var SCROLLMEM = {}, CURKEY = null, restoreToken = 0;
function saveScroll(){
  if(CURKEY == null) return;
  var sc = $('#scroll'); if(sc) SCROLLMEM[CURKEY] = sc.scrollTop;
}
function restoreScroll(y){
  var sc = $('#scroll'); if(!sc) return;
  if(!y){ sc.scrollTop = 0; return; }
  var tok = ++restoreToken, lastH = -1, stable = 0, frames = 0;
  (function step(){
    if(tok !== restoreToken) return; /* a newer render or a real touch supersedes */
    sc.scrollTop = y;
    var h = sc.scrollHeight;
    var landed = Math.abs(sc.scrollTop - y) <= 1;
    var clamped = sc.scrollTop + sc.clientHeight >= h - 1; /* content shorter than the remembered spot */
    if((landed || clamped) && h === lastH){ if(++stable >= 12) return; }
    else stable = 0;
    lastH = h;
    if(++frames >= 240) return;
    /* list views chunk-render over several frames and a webfont swap can
       shift row heights after the first landing — keep re-applying until
       the height has been stable a dozen frames (the rail jump settle,
       generalised). A user gesture cancels via restoreToken. */
    requestAnimationFrame(step);
  })();
}
function parseRoute(){
  var h = location.hash || '#/contacts';
  var parts = h.replace(/^#\//, '').split('/');
  if(parts[0] === 'p' && parts[1]) return { name:'person', id:decodeURIComponent(parts.slice(1).join('/')) };
  if(parts[0] === 'groups' && parts[1]) return { name:'group', id:decodeURIComponent(parts.slice(1).join('/')) };
  if(parts[0] === 'groups') return { name:'groups' };
  if(parts[0] === 'lists' && parts[1] && parts[2]) return { name:'list', kind:decodeURIComponent(parts[1]), id:decodeURIComponent(parts[2]) };
  if(parts[0] === 'lists') return { name:'lists' };
  if(parts[0] === 'flow' && parts[1] === 'online' && parts[2] === 'log' && parts[3]) return { name:'fdetails', cat:'online', id:decodeURIComponent(parts.slice(3).join('/')) };
  if(parts[0] === 'flow' && parts[1] === 'online') return { name:'pick', cat:'online' };
  if(parts[0] === 'flow' && parts[1] === 'location' && parts[2] === 'pick') return { name:'pick', cat:'location' };
  if(parts[0] === 'flow' && parts[1] === 'location') return { name:'fdetails', cat:'location' };
  if(parts[0] === 'all') return { name:'all' };
  return { name:'home' };
}
function render(){
  if(!D) return;
  saveScroll(); /* the view being left keeps its place */
  var r = parseRoute();
  S.route = r.name;
  CURKEY = location.hash || '#/contacts';
  $('#rail').classList.remove('on'); $('#totop').classList.remove('on');
  if(r.name !== 'all' && r.name !== 'pick'){ var dk0 = $('#deck'); dk0.hidden = true; dk0.innerHTML = ''; }
  var v = $('#view');
  if(r.name === 'person'){
    var di = diFromId(r.id);
    if(di == null || !liveEntry(D.directory[di])){ v.innerHTML = '<div class="empty"><h3>That contact is not here.</h3><p>It may have been merged or removed.</p></div>'; return; }
    S.di = di; viewPerson(v, di);
  } else if(r.name === 'groups') viewGroups(v);
  else if(r.name === 'group') viewMembers(v, 'Groups', r.id, groupMembers(r.id));
  else if(r.name === 'lists') viewLists(v);
  else if(r.name === 'list') viewMembers(v, listTitle(r.kind, r.id), r.id, listMembers(r.kind, r.id));
  else if(r.name === 'pick') viewPick(v, r.cat);
  else if(r.name === 'fdetails') viewFlowDetails(v, r.cat, r.id);
  else if(r.name === 'all') viewContacts(v);
  else viewHome(v);
  layoutChrome();
  restoreScroll(SCROLLMEM[CURKEY] || 0);
}

/* ---------- Contacts select screen ---------- */
function sortPeople(dis){
  var byName = function(a, b){ return dispName(D.directory[a]).localeCompare(dispName(D.directory[b])); };
  var out = dis.slice();
  if(S.sort === 'za') out.sort(function(a, b){ return byName(b, a); });
  else if(S.sort === 'contacted') out.sort(function(a, b){
    var x = flexKey(gv(D.directory[a], 'last_contact')), y = flexKey(gv(D.directory[b], 'last_contact'));
    if(x !== y) return x < y ? 1 : -1;
    return byName(a, b);
  });
  else if(S.sort === 'changed') out.sort(function(a, b){
    var x = String(gv(D.directory[a], 'updated_at') || ''), y = String(gv(D.directory[b], 'updated_at') || '');
    if(x !== y) return x < y ? 1 : -1;
    return byName(a, b);
  });
  else out.sort(byName);
  return out;
}
function groupKeyFor(di){
  var e = D.directory[di];
  if(S.sort === 'contacted'){
    var k = flexKey(gv(e, 'last_contact'));
    return k ? fmtDate(k.slice(0, 7)) : 'No contact logged';
  }
  if(S.sort === 'changed'){
    var u = String(gv(e, 'updated_at') || '');
    return u ? fmtDate(u.slice(0, 7)) : 'Earlier';
  }
  var ch = dispName(e).trim().charAt(0).toUpperCase();
  return /[A-Z]/.test(ch) ? ch : '#';
}
function filteredPeople(){
  var dis = people();

function paintList(){
  var list = $('#plist'); if(!list) return;
  var dis = filteredPeople();
  if(!dis.length){ list.innerHTML = '<div class="empty"><h3>No matches.</h3><p>Try a different search.</p></div>'; $('#rail').classList.remove('on'); return; }
  /* group into sticky-header blocks */
  var groups = [], cur = null;
  dis.forEach(function(di){
    var k = groupKeyFor(di);
    if(!cur || cur.k !== k){ cur = { k:k, dis:[] }; groups.push(cur); }
    cur.dis.push(di);
  });
  var token = ++renderToken;
  list.innerHTML = '';
  var gi = 0;
  function chunk(){
    if(token !== renderToken) return;
    var html = '', n = 0;
    while(gi < groups.length && n < 220){
      var g = groups[gi++];
      /* each section is its own wrapper so the sticky header is constrained
         to its section and gets pushed off by the next one (iOS behavior) —
         flat siblings would all pile up stuck at the top together */
      html += '<div class="lsec"><div class="lhead" data-letter="' + esc(g.k) + '">' + esc(g.k) + '</div>' + g.dis.map(function(di){ return personRow(di); }).join('') + '</div>';
      n += g.dis.length;
    }
    list.insertAdjacentHTML('beforeend', html);
    if(gi < groups.length) requestAnimationFrame(chunk);
    else buildRail(groups);
  }
  chunk();
}

/* ---------- A-Z rail: tap to jump, press-and-slide to scrub (iOS Contacts style) ---------- */
var RAIL = { sections:{} };
var jumpToken = 0;
function alignHead(head){
  var sc = $('#scroll');
  var delta = head.getBoundingClientRect().top - sc.getBoundingClientRect().top;
  if(Math.abs(delta) > 1) sc.scrollTop = Math.max(0, sc.scrollTop + delta);
  return Math.abs(delta);
}
function jumpToLetter(L){
  if(!L || !RAIL.sections[L]) return;
  var head = null;
  $$('#plist .lhead').forEach(function(h){ if(h.getAttribute('data-letter') === L) head = h; });
  if(!head) return;
  $$('#rail button').forEach(function(b){ b.classList.toggle('hit', b.getAttribute('data-rail') === L); });
  /* rows far down the list carry estimated heights (content-visibility)
     until they render, so one jump can land short — re-measure the target
     header over a few frames and settle it exactly onto the top */
  var tok = ++jumpToken;
  alignHead(head);
  (function settle(n){
    if(tok !== jumpToken || n >= 3) return;
    setTimeout(function(){
      requestAnimationFrame(function(){
        if(tok !== jumpToken) return;
        if(alignHead(head) > 1) settle(n + 1);
      });
    }, 55);
  })(0);
}
function buildRail(groups){
  var rail = $('#rail'), list = $('#plist');
  RAIL = { sections:{} };
  groups.forEach(function(g){ RAIL.sections[g.k] = 1; });
  var usable = (S.sort === 'az' || S.sort === 'za') && groups.length > 1;
  if(list) list.classList.toggle('railpad', !!usable);
  if(!usable){ rail.classList.remove('on'); rail.innerHTML = ''; return; }
  var letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');
  rail.innerHTML = letters.map(function(L){
    return '<button type="button" data-rail="' + L + '"' + (RAIL.sections[L] ? '' : ' class="off"') + ' aria-label="Jump to ' + L + '">' + L + '</button>';
  }).join('');
  rail.classList.add('on');
  layoutChrome();
}
var scrub = { on:false, letter:'', lastAt:0, hideT:null };
function railLetterAt(y){
  var rail = $('#rail'), r = rail.getBoundingClientRect(), btns = $$('#rail button');
  if(!btns.length || !r.height) return '';
  var idx = Math.floor((y - r.top) / r.height * btns.length);
  idx = Math.max(0, Math.min(btns.length - 1, idx));
  if(RAIL.sections[btns[idx].getAttribute('data-rail')]) return btns[idx].getAttribute('data-rail');
  for(var d = 1; d < btns.length; d++){
    var lo = btns[idx - d], hi = btns[idx + d];
    if(lo && RAIL.sections[lo.getAttribute('data-rail')]) return lo.getAttribute('data-rail');
    if(hi && RAIL.sections[hi.getAttribute('data-rail')]) return hi.getAttribute('data-rail');
  }
  return '';
}
function scrubTo(y){
  var L = railLetterAt(y);
  if(!L) return;
  var bub = $('#scrubbub');
  bub.textContent = L;
  bub.style.top = Math.max(96, Math.min(window.innerHeight - 130, y)) + 'px';
  bub.classList.add('on');
  if(L !== scrub.letter){ scrub.letter = L; jumpToLetter(L); }
}
function scrubEnd(){
  if(!scrub.on) return;
  scrub.on = false; scrub.lastAt = Date.now();
  jumpToken++; /* a settle still nudging the scroll after a scrub moves rows
                  out from under the next tap — kill it when the finger lifts */
  clearTimeout(scrub.hideT);
  scrub.hideT = setTimeout(function(){
    $('#scrubbub').classList.remove('on');
    $$('#rail button.hit').forEach(function(b){ b.classList.remove('hit'); });
    scrub.letter = '';
  }, 260);
}
(function(){
  var railEl = $('#rail');
  railEl.addEventListener('pointerdown', function(ev){
    if(!railEl.classList.contains('on')) return;
    ev.preventDefault();
    clearTimeout(scrub.hideT);
    scrub.on = true; scrub.letter = '';
    try{ railEl.setPointerCapture(ev.pointerId); }catch(x){}
    scrubTo(ev.clientY);
  });
  railEl.addEventListener('pointermove', function(ev){ if(scrub.on){ ev.preventDefault(); scrubTo(ev.clientY); } });
  railEl.addEventListener('pointerup', scrubEnd);
  railEl.addEventListener('pointercancel', scrubEnd);
  railEl.addEventListener('click', function(ev){
    /* pointer scrub already jumped — ignore the trailing click; a bare click
       (keyboard Enter, assistive tech) still jumps on its own */
    if(scrub.on || Date.now() - scrub.lastAt < 400) return;
    var b = ev.target && ev.target.closest ? ev.target.closest('[data-rail]') : null;
    if(b && !b.classList.contains('off')) jumpToLetter(b.getAttribute('data-rail'));
  });
})();

/* tap insurance (JD 2026-10-30: "sometimes I have to tap a contact twice"):
   iOS can swallow a row's click — the keyboard dismissing over the search
   field, a list chunk re-rendering mid-tap, a rail settle still moving the
   page. If a clean tap (down + up, barely moved) produced no navigation
   within 220ms, navigate ourselves. When the real click does fire it marks
   the tap done first, so this never double-navigates; a scroll gesture
   moves too far to qualify, and a newer tap supersedes a pending one. */
var TAP = { di:null, act:null, x:0, y:0, seq:0, doneSeq:0 };
document.addEventListener('pointerdown', function(ev){
  jumpToken++; /* any fresh touch ends leftover scroll settling */
  restoreToken++; /* ...and cancels a pending scroll restore */
  var t = ev.target && ev.target.closest ? ev.target : null;
  var pb = t && t.closest ? t.closest('[data-pick]') : null;
  var ob = t && t.closest ? t.closest('[data-open]') : null;
  TAP.act = pb ? 'pick' : (ob ? 'open' : null);
  TAP.di = pb ? +pb.getAttribute('data-pick') : (ob ? +ob.getAttribute('data-open') : null);
  TAP.x = ev.clientX; TAP.y = ev.clientY; TAP.seq++;
}, true);
document.addEventListener('pointerup', function(ev){
  if(TAP.di == null) return;
  var di = TAP.di, act = TAP.act, seq = TAP.seq; TAP.di = null; TAP.act = null;
  if(Math.abs(ev.clientX - TAP.x) > 12 || Math.abs(ev.clientY - TAP.y) > 12) return;
  setTimeout(function(){
    if(!D || TAP.doneSeq >= seq || TAP.seq !== seq) return;
    if(di == null || !D.directory[di]) return;
    if(act === 'pick'){ if(parseRoute().name === 'pick') doPick(di); return; }
    var want = '#/p/' + encodeURIComponent(pkey(D.directory[di]));
    if(location.hash !== want) openPerson(di);
  }, 220);
}, true);

      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(d){
        D = d;
        D.directory.forEach(function(r2, i){ BYN[(r2.name || '').toLowerCase()] = i; var dn = String(((r2.profile || {}).display_name || r2.display || '')).toLowerCase(); if(dn && !(dn in BYN)) BYN[dn] = i; normEntry(r2); PK2I[pkey(r2)] = i; });
        /* retire wins the bake already shows, then re-apply survivors + outbox */
        Object.keys(WINS).forEach(function(k){
          var di = PK2I[k]; if(di === undefined) return;
          var f = WINS[k], dirty = false;
          Object.keys(f).forEach(function(kk){ if(winsEq((D.directory[di].profile || {})[kk], f[kk].v)){ delete f[kk]; dirty = true; } });
          if(!Object.keys(f).length) delete WINS[k];
          if(dirty) winsSave();
        });
        try{ applyOutbox(); }catch(px){}
        winsApplyAll();
        render();
        paintSync();
        outKick();
      })
      .catch(function(err){
        if(tries < 4){ $('#view').innerHTML = '<div class="skel">Loading (retry ' + tries + ' of 3)…</div>'; setTimeout(attempt, 1200 * tries); }
        else $('#view').innerHTML = '<div class="empty"><h3>Could not load the data.</h3><p>' + esc(String(err && err.message || err)) + '</p><p style="margin-top:12px"><button type="button" class="btn" onclick="location.reload()">Retry</button></p></div>';
      });
  })();
}
addEventListener('hashchange', render);
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
