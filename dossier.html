<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dossier — North Country Circle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dossier.css?v=561ef95923">
</head>
<body>
<canvas id="ambient" aria-hidden="true"></canvas>
<div id="vig" aria-hidden="true"></div>

<header id="topbar" class="glass">
  <button id="listtoggle" class="tbtn on" title="Toggle directory list" aria-label="Toggle directory list">
    <span aria-hidden="true">☰</span>
  </button>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">◈</span>
    <div class="brand-text"><h1>North Country Circle</h1><small>dossier</small></div>
  </div>
  <div class="tsearch" role="search">
    <input id="fq" type="search" placeholder="Search the 901…" autocomplete="off" aria-label="Search names">
  </div>
  <select id="frel" aria-label="Filter by relation">
    <option value="">All relations</option>
    <option value="mutual">Mutual</option>
    <option value="following">Following</option>
    <option value="follower">Follower</option>
  </select>
  <button id="tagpill" class="tbtn pill" hidden title="Clear tag filter">
    <span class="dot gold"></span><span></span><b class="x" aria-hidden="true">×</b>
  </button>
  <button id="bgtoggle" class="tbtn pill" title="Show the full circle as background" aria-pressed="false">
    <span class="dot" aria-hidden="true"></span>Full circle
  </button>
  <button id="auditfilter" class="tbtn pill" title="Show only contacts that still need audit" aria-pressed="false">
    <span class="dot amber" aria-hidden="true"></span>Needs audit
  </button>
  <span id="auditpill" class="apill" title="Audit progress"></span>
  <button id="settingsbtn" class="tbtn" title="Settings" aria-label="Settings">⚙</button>
  <div id="modeToggle" role="group" aria-label="View mode">
    <button data-m="2d" aria-label="2D view">2D</button><button data-m="3d" class="on" aria-label="3D view">3D</button>
  </div>
  <span id="fresh"></span>
</header>

<aside id="left" class="glass panel" aria-label="Directory list">
  <div id="lcount"></div>
  <div id="leftbody"></div>
</aside>

<main id="stage" aria-label="Connection map">
  <canvas id="hub"></canvas>
  <div id="gl3d" hidden></div>
  <div id="tip" hidden></div>
  <div id="stagehint">Drag to pan · scroll to zoom · click a node to open their dossier</div>
</main>

<aside id="right" class="glass panel" aria-label="Dossier">
  <div id="rightbody"></div>
</aside>

<script src="dossier.js?v=a5ee845a13"></script>
</body>
</html>
