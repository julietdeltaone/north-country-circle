<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass Concepts — North Country Circle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box; margin:0; padding:0}
:root{ --disp:'Space Grotesk',sans-serif; --body:'Archivo',sans-serif }
html[data-mode="dark"]{ --page-bg:#0b0b0d; --page-ink:#f2f2f2; --page-dim:#a3a3ab; --page-faint:#67676f; --page-line:#26262b; --btn-bg:#1b1b1f; --btn-edge:#3a3a41 }
html[data-mode="light"]{ --page-bg:#ececee; --page-ink:#17171a; --page-dim:#55555e; --page-faint:#84848e; --page-line:#d4d4da; --btn-bg:#ffffff; --btn-edge:#c6c6ce }
body{background:var(--page-bg); color:var(--page-ink); font-family:var(--body); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; transition:background .35s ease, color .35s ease}
.wrap{max-width:1200px; margin:0 auto; padding:0 20px 72px}
/* ---- page chrome ---- */
.chrome{position:sticky; top:0; z-index:50; background:var(--page-bg); border-bottom:1px solid var(--page-line); transition:background .35s ease}
.chrome-in{max-width:1200px; margin:0 auto; padding:16px 20px 14px; display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap}
.kick{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--page-faint); font-weight:600}
.chrome h1{font-family:var(--disp); font-size:23px; font-weight:700; margin:3px 0 2px}
.chrome .sub{color:var(--page-dim); font-size:12.5px; max-width:640px}
#modeToggle{appearance:none; cursor:pointer; font-family:var(--disp); font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
  color:var(--page-ink); background:var(--btn-bg); border:1px solid var(--btn-edge); border-radius:999px; padding:10px 18px; display:inline-flex; align-items:center; gap:9px}
#modeToggle .dot{width:9px; height:9px; border-radius:50%; background:var(--page-ink); box-shadow:inset -3px -2px 0 0 var(--btn-bg)}
html[data-mode="light"] #modeToggle .dot{background:#f5b73e; box-shadow:0 0 0 3px rgba(245,183,62,.25)}
#modeToggle:focus-visible{outline:2px solid var(--page-ink); outline-offset:2px}
/* ---- concept frame ---- */
.concept{padding-top:34px}
.c-head{display:flex; align-items:baseline; gap:13px; flex-wrap:wrap; margin-bottom:3px}
.c-head .n{font-family:var(--disp); font-size:12px; font-weight:700; color:var(--page-faint)}
.c-head h2{font-family:var(--disp); font-size:19px; font-weight:700; text-transform:uppercase; letter-spacing:.05em}
.c-note{color:var(--page-dim); font-size:13px; max-width:820px; margin-bottom:16px}
/* ---- stage + backdrop ---- */
.stage{position:relative; overflow:hidden; border-radius:26px; padding:30px 30px 34px;
  background:
    radial-gradient(620px 340px at 10% -4%, var(--glow1), transparent 62%),
    radial-gradient(720px 430px at 90% 14%, var(--glow2), transparent 62%),
    radial-gradient(580px 400px at 52% 112%, var(--glow3), transparent 62%),
    var(--bd-base);
  box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}
.blob{position:absolute; border-radius:50%; filter:blur(46px); pointer-events:none}
.blob.b1{width:340px; height:340px; left:-90px; top:-110px; background:var(--blob1); opacity:.5}
.blob.b2{width:300px; height:300px; right:-70px; bottom:-120px; background:var(--blob2); opacity:.42}
/* ---- glass ---- */
.glass{background:var(--glass); -webkit-backdrop-filter:blur(18px) saturate(160%); backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--edge); border-radius:18px;
  box-shadow:0 24px 44px -20px var(--shadow), inset 0 1px 0 var(--edge-soft)}
.mock{position:relative; z-index:2; color:var(--ink); max-width:800px}
.appbar{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:13px 18px; border-radius:16px}
.app-name{font-family:var(--disp); font-size:18px; font-weight:700; letter-spacing:.01em}
.chip{font-family:var(--disp); font-size:10.5px; font-weight:600; letter-spacing:.12em; background:var(--chip); border:1px solid var(--edge);
  padding:4px 10px; border-radius:999px; color:var(--ink); white-space:nowrap}
.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:14px}
.kpi{padding:15px 17px 13px; border-radius:16px}
.k-num{display:block; font-family:var(--disp); font-size:27px; font-weight:700; line-height:1.05}
.k-lab{display:block; margin-top:3px; font-size:10px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--dim)}
.cols{display:grid; grid-template-columns:1.15fr .85fr; gap:14px; margin-top:14px}
.panel{padding:17px 19px 15px}
.panel h3{font-family:var(--disp); font-size:11px; font-weight:600; letter-spacing:.15em; text-transform:uppercase; color:var(--dim); margin-bottom:13px}
.bar-row{display:grid; grid-template-columns:74px 1fr 30px; align-items:center; gap:11px; padding:5px 0}
.b-name{font-size:13px; font-weight:500}
.b-track{height:9px; border-radius:99px; background:var(--track); overflow:hidden}
.b-fill{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg, var(--accent2), var(--accent))}
.b-val{font-family:var(--disp); font-size:13px; font-weight:600; text-align:right}
.person{display:flex; align-items:center; gap:12px; padding:7px 0}
.avatar{flex:none; width:36px; height:36px; border-radius:50%; background:var(--chip); border:1px solid var(--edge);
  display:flex; align-items:center; justify-content:center; font-family:var(--disp); font-size:12px; font-weight:700}
.p-main{min-width:0}
.p-name{font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.p-meta{font-size:11.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.p-tier{margin-left:auto; flex:none; font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--dim);
  border:1px solid var(--edge); border-radius:999px; padding:3px 9px; background:var(--chip)}
/* ---- inspector card ---- */
.inspector{position:absolute; z-index:3; right:26px; bottom:24px; width:264px; padding:16px 18px 15px; border-radius:18px;
  background:var(--glass2); color:var(--ink)}
.i-kick{font-size:9.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin-bottom:6px}
.i-name{font-family:var(--disp); font-size:17px; font-weight:700; line-height:1.15}
.i-meta{font-size:12px; color:var(--dim); margin:2px 0 11px}
.i-rows{border-top:1px solid var(--edge); padding-top:9px; display:grid; gap:5px}
.i-row{display:flex; justify-content:space-between; gap:10px; font-size:12px}
.i-row dt{color:var(--dim)} .i-row dd{font-weight:600}
.i-btn{margin-top:12px; width:100%; appearance:none; border:1px solid var(--edge); background:var(--chip); color:var(--ink);
  font-family:var(--disp); font-size:11.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
  border-radius:10px; padding:8px 0; cursor:pointer}
.foot{margin-top:26px; font-size:11px; color:var(--page-faint); letter-spacing:.05em; text-transform:uppercase}
@media (max-width:1150px){
  .inspector{position:static; width:auto; margin-top:14px}
}
@media (max-width:820px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .cols{grid-template-columns:1fr}
  .stage{padding:20px 16px 24px}
}
/* ================= variants ================= */
/* 1 EMBER */
html[data-mode="dark"] .v-ember{--bd-base:#160f08; --glow1:rgba(255,138,60,.50); --glow2:rgba(255,90,40,.34); --glow3:rgba(140,70,20,.45); --blob1:#ff8a3c; --blob2:#c1440e;
  --glass:rgba(52,34,20,.48); --glass2:rgba(70,45,25,.60); --edge:rgba(255,196,130,.38); --edge-soft:rgba(255,210,160,.22);
  --ink:#fff3e2; --dim:rgba(255,231,204,.74); --accent:#ffa53c; --accent2:#ff7847; --track:rgba(255,220,180,.15); --shadow:rgba(0,0,0,.55); --chip:rgba(255,165,60,.18)}
html[data-mode="light"] .v-ember{--bd-base:#f6e8d4; --glow1:rgba(255,170,90,.55); --glow2:rgba(255,200,140,.50); --glow3:rgba(255,150,80,.35); --blob1:#ffb066; --blob2:#ff8a3c;
  --glass:rgba(255,251,244,.52); --glass2:rgba(255,248,236,.68); --edge:rgba(190,130,60,.30); --edge-soft:rgba(255,255,255,.70);
  --ink:#3b2410; --dim:rgba(96,62,28,.80); --accent:#d97a1e; --accent2:#e85d26; --track:rgba(150,95,40,.15); --shadow:rgba(150,95,30,.30); --chip:rgba(217,122,30,.14)}
/* 2 PASTEL */
html[data-mode="dark"] .v-pastel{--bd-base:#221c38; --glow1:rgba(167,139,250,.50); --glow2:rgba(240,166,200,.40); --glow3:rgba(110,231,190,.30); --blob1:#a78bfa; --blob2:#f0a6c8;
  --glass:rgba(255,255,255,.10); --glass2:rgba(255,255,255,.17); --edge:rgba(255,255,255,.35); --edge-soft:rgba(255,255,255,.18);
  --ink:#f6f2ff; --dim:rgba(238,232,255,.74); --accent:#c4a7fd; --accent2:#f0a6c8; --track:rgba(255,255,255,.15); --shadow:rgba(10,4,30,.50); --chip:rgba(196,167,253,.20)}
html[data-mode="light"] .v-pastel{--bd-base:#efeafd; --glow1:rgba(196,167,253,.55); --glow2:rgba(250,200,225,.60); --glow3:rgba(170,240,210,.50); --blob1:#c4a7fd; --blob2:#f7b8d8;
  --glass:rgba(255,255,255,.55); --glass2:rgba(255,255,255,.72); --edge:rgba(255,255,255,.85); --edge-soft:rgba(255,255,255,.90);
  --ink:#372e52; --dim:rgba(74,62,110,.78); --accent:#8b6fd8; --accent2:#e58bb8; --track:rgba(110,90,180,.13); --shadow:rgba(120,100,190,.28); --chip:rgba(139,111,216,.12)}
/* 3 MIDNIGHT */
html[data-mode="dark"] .v-midnight{--bd-base:#050a18; --glow1:rgba(37,99,235,.55); --glow2:rgba(14,165,233,.40); --glow3:rgba(30,58,138,.60); --blob1:#2563eb; --blob2:#0ea5e9;
  --glass:rgba(13,24,48,.52); --glass2:rgba(19,34,64,.64); --edge:rgba(147,197,253,.32); --edge-soft:rgba(190,220,255,.18);
  --ink:#eaf2ff; --dim:rgba(200,220,255,.72); --accent:#5eb1ff; --accent2:#38bdf8; --track:rgba(160,200,255,.14); --shadow:rgba(0,0,10,.60); --chip:rgba(94,177,255,.16)}
html[data-mode="light"] .v-midnight{--bd-base:#e6effc; --glow1:rgba(147,197,253,.60); --glow2:rgba(186,220,253,.55); --glow3:rgba(125,180,250,.40); --blob1:#93c5fd; --blob2:#7dd3fc;
  --glass:rgba(255,255,255,.50); --glass2:rgba(255,255,255,.68); --edge:rgba(255,255,255,.78); --edge-soft:rgba(255,255,255,.85);
  --ink:#10233f; --dim:rgba(38,66,105,.80); --accent:#2470c9; --accent2:#0e9bd8; --track:rgba(40,90,160,.13); --shadow:rgba(50,100,180,.28); --chip:rgba(36,112,201,.12)}
/* 4 MONO FROST */
html[data-mode="dark"] .v-mono{--bd-base:#0e0e10; --glow1:rgba(160,160,170,.30); --glow2:rgba(90,90,100,.40); --glow3:rgba(60,60,68,.50); --blob1:#8e8e96; --blob2:#55555e;
  --glass:rgba(34,34,38,.55); --glass2:rgba(46,46,52,.64); --edge:rgba(255,255,255,.20); --edge-soft:rgba(255,255,255,.13);
  --ink:#f4f4f5; --dim:rgba(238,238,242,.70); --accent:#e8e8ea; --accent2:#a1a1aa; --track:rgba(255,255,255,.13); --shadow:rgba(0,0,0,.60); --chip:rgba(255,255,255,.12)}
html[data-mode="light"] .v-mono{--bd-base:#e8e8eb; --glow1:rgba(255,255,255,.85); --glow2:rgba(190,190,198,.55); --glow3:rgba(210,210,218,.60); --blob1:#ffffff; --blob2:#c9c9d1;
  --glass:rgba(255,255,255,.50); --glass2:rgba(255,255,255,.70); --edge:rgba(255,255,255,.82); --edge-soft:rgba(255,255,255,.90);
  --ink:#17171a; --dim:rgba(45,45,52,.78); --accent:#3f3f46; --accent2:#71717a; --track:rgba(30,30,40,.11); --shadow:rgba(60,60,80,.24); --chip:rgba(40,40,50,.08)}
/* 5 FOREST */
html[data-mode="dark"] .v-forest{--bd-base:#06130c; --glow1:rgba(31,157,102,.50); --glow2:rgba(122,199,79,.32); --glow3:rgba(13,80,52,.55); --blob1:#22b573; --blob2:#7ac74f;
  --glass:rgba(13,31,21,.52); --glass2:rgba(18,42,28,.64); --edge:rgba(167,255,205,.28); --edge-soft:rgba(200,255,220,.15);
  --ink:#ecfdf3; --dim:rgba(205,250,220,.72); --accent:#4ade80; --accent2:#a3e635; --track:rgba(190,255,215,.14); --shadow:rgba(0,10,4,.60); --chip:rgba(74,222,128,.16)}
html[data-mode="light"] .v-forest{--bd-base:#e6f2e2; --glow1:rgba(134,239,172,.60); --glow2:rgba(190,242,160,.55); --glow3:rgba(110,220,160,.40); --blob1:#86efac; --blob2:#bef264;
  --glass:rgba(255,255,255,.50); --glass2:rgba(255,255,255,.68); --edge:rgba(255,255,255,.80); --edge-soft:rgba(255,255,255,.88);
  --ink:#17301e; --dim:rgba(43,84,54,.80); --accent:#1e7a46; --accent2:#65a30d; --track:rgba(30,100,55,.13); --shadow:rgba(40,110,60,.28); --chip:rgba(30,122,70,.12)}
/* 6 CLEAR */
html[data-mode="dark"] .v-clear{--bd-base:#060607; --glow1:rgba(148,178,220,.26); --glow2:rgba(220,200,170,.18); --glow3:rgba(120,130,150,.25); --blob1:#5f7086; --blob2:#6e6250;
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.10); --edge:rgba(255,255,255,.30); --edge-soft:rgba(255,255,255,.16);
  --ink:#f7f7f8; --dim:rgba(240,240,244,.72); --accent:#ffffff; --accent2:#c9d4e2; --track:rgba(255,255,255,.15); --shadow:rgba(0,0,0,.55); --chip:rgba(255,255,255,.12)}
html[data-mode="light"] .v-clear{--bd-base:#eef3f7; --glow1:rgba(186,220,250,.65); --glow2:rgba(255,232,200,.55); --glow3:rgba(210,235,220,.55); --blob1:#bcdcfb; --blob2:#ffe3ba;
  --glass:rgba(255,255,255,.30); --glass2:rgba(255,255,255,.46); --edge:rgba(255,255,255,.72); --edge-soft:rgba(255,255,255,.85);
  --ink:#141a20; --dim:rgba(38,50,62,.80); --accent:#141a20; --accent2:#4a6076; --track:rgba(25,40,55,.11); --shadow:rgba(80,100,120,.24); --chip:rgba(20,26,32,.07)}
.v-clear .glass{ -webkit-backdrop-filter:blur(26px) saturate(150%); backdrop-filter:blur(26px) saturate(150%) }
</style>
</head>
<body>
<header class="chrome">
  <div class="chrome-in">
    <div>
      <div class="kick">North Country Circle · Skin trial</div>
      <h1>Frosted glass, six ways</h1>
      <p class="sub">Every panel below is the same simplified Home — same layout, same numbers. Only the skin changes. Flip the switch and all six go light together.</p>
    </div>
    <button id="modeToggle" type="button" aria-pressed="true"><span class="dot" aria-hidden="true"></span><span id="modeLabel">Dark · switch to light</span></button>
  </div>
</header>
<div class="wrap">
  <main id="concepts"></main>
  <p class="foot">Skin previews only · Live app stays on Swiss Mono until you rule</p>
</div>
<script>
var MOCK = `
  <div class="blob b1" aria-hidden="true"></div><div class="blob b2" aria-hidden="true"></div>
  <div class="mock">
    <div class="appbar glass">
      <span class="app-name">North Country Circle</span>
      <span class="chip">V2.55.0</span>
    </div>
    <div class="kpis">
      <div class="kpi glass"><span class="k-num">726</span><span class="k-lab">People</span></div>
      <div class="kpi glass"><span class="k-num">1,889</span><span class="k-lab">Footprint facts</span></div>
      <div class="kpi glass"><span class="k-num">396</span><span class="k-lab">Photos on file</span></div>
      <div class="kpi glass"><span class="k-num">336</span><span class="k-lab">Located</span></div>
    </div>
    <div class="cols">
      <section class="glass panel" aria-label="Where they are">
        <h3>Where they are</h3>
        <div class="bar-row"><span class="b-name">Potsdam</span><span class="b-track"><span class="b-fill" style="width:100%"></span></span><span class="b-val">61</span></div>
        <div class="bar-row"><span class="b-name">Canton</span><span class="b-track"><span class="b-fill" style="width:57%"></span></span><span class="b-val">35</span></div>
        <div class="bar-row"><span class="b-name">Massena</span><span class="b-track"><span class="b-fill" style="width:41%"></span></span><span class="b-val">25</span></div>
        <div class="bar-row"><span class="b-name">Norwood</span><span class="b-track"><span class="b-fill" style="width:36%"></span></span><span class="b-val">22</span></div>
        <div class="bar-row"><span class="b-name">Madrid</span><span class="b-track"><span class="b-fill" style="width:28%"></span></span><span class="b-val">17</span></div>
      </section>
      <section class="glass panel" aria-label="Inner circle">
        <h3>Inner circle</h3>
        <div class="person"><span class="avatar" aria-hidden="true">CG</span><span class="p-main"><span class="p-name">Catherine Green</span><br><span class="p-meta">Madrid, NY</span></span><span class="p-tier">Family</span></div>
        <div class="person"><span class="avatar" aria-hidden="true">EC</span><span class="p-main"><span class="p-name">Ellie Criscitello</span><br><span class="p-meta">Potsdam, NY</span></span><span class="p-tier">Family</span></div>
        <div class="person"><span class="avatar" aria-hidden="true">JM</span><span class="p-main"><span class="p-name">John Meyers</span><br><span class="p-meta">Potsdam, NY</span></span><span class="p-tier">Family</span></div>
        <div class="person"><span class="avatar" aria-hidden="true">NT</span><span class="p-main"><span class="p-name">Nathaniel Tomford</span><br><span class="p-meta">Potsdam, NY</span></span><span class="p-tier">Close</span></div>
      </section>
    </div>
  </div>
  <aside class="inspector glass" aria-label="Inspector preview">
    <div class="i-kick">Inspector</div>
    <div class="i-name">Catherine Green</div>
    <div class="i-meta">Madrid, NY · Family</div>
    <dl class="i-rows">
      <div class="i-row"><dt>Tier</dt><dd>Inner circle</dd></div>
      <div class="i-row"><dt>Known since</dt><dd>2000</dd></div>
      <div class="i-row"><dt>Mutual</dt><dd>18 people</dd></div>
    </dl>
    <button class="i-btn" type="button" tabindex="-1">Open profile</button>
  </aside>`;
var VARIANTS = [
  { cls:'v-ember',    name:'Ember',      note:'Dark warm glass in the Behance mold: brown-black depth, amber and bronze glow, bronze-tinted panes. Light mode goes warm cream.' },
  { cls:'v-pastel',   name:'Pastel',     note:'The Tailkits feel: lavender, blush, and mint fields behind white frost. Light mode is the pale original; dark mode drops it into deep plum.' },
  { cls:'v-midnight', name:'Midnight',   note:'Deep navy glass, cool and sleek. Blue glow fields, ice-edge panes, sky accent. Light mode turns it pale sky.' },
  { cls:'v-mono',     name:'Mono Frost', note:'Grayscale glass: charcoal and graphite with neutral panes and no color at all. The closest of the six to your current taste.' },
  { cls:'v-forest',   name:'Forest',     note:'Deep botanical glass: emerald and lime glow under dark green panes. Light mode goes pale sage.' },
  { cls:'v-clear',    name:'Clear',      note:'Almost no tint at all — the glass is purely the blur and the edge light. Maximum frost over a bright airy field in light mode, near-black in dark.' }
];
var main = document.getElementById('concepts');
VARIANTS.forEach(function(v, i){
  var sec = document.createElement('section');
  sec.className = 'concept'; sec.id = 'c' + (i + 1);
  sec.innerHTML = '<div class="c-head"><span class="n">' + (i + 1) + ' / 6</span><h2>' + v.name + '</h2></div>' +
    '<p class="c-note">' + v.note + '</p>' +
    '<div class="stage ' + v.cls + '">' + MOCK + '</div>';
  main.appendChild(sec);
});
var btn = document.getElementById('modeToggle'), label = document.getElementById('modeLabel');
btn.addEventListener('click', function(){
  var dark = document.documentElement.getAttribute('data-mode') === 'dark';
  document.documentElement.setAttribute('data-mode', dark ? 'light' : 'dark');
  btn.setAttribute('aria-pressed', String(!dark));
  label.textContent = dark ? 'Light · switch to dark' : 'Dark · switch to light';
});
</script>
</body>
</html>
