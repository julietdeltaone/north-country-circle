<style>
:root{
  --bg:#0a0a0a; --panel:#101010; --panel2:#141414; --line:#262626; --line2:#1b1b1b;
  --ink:#f2f2f2; --dim:#9a9a9a; --faint:#636363; --red:#e30613;
  --g1:#f2f2f2; --g2:#b5b5b5; --g3:#7d7d7d; --g4:#4a4a4a; --g5:#2b2b2b;
  --disp:'Space Grotesk',sans-serif; --body:'Archivo',sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0}
html{background:var(--bg)}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased}
a{color:var(--ink)}
.wrap{max-width:1240px; margin:0 auto; padding:0 20px 64px}
/* ---- page chrome ---- */
.topbar{position:sticky; top:0; z-index:60; background:var(--bg); border-bottom:1px solid var(--line)}
.topbar-in{max-width:1240px; margin:0 auto; padding:14px 20px 0}
.kick{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); font-weight:600}
.topbar h1{font-family:var(--disp); font-size:22px; font-weight:700; letter-spacing:.01em; margin:3px 0 2px}
.topbar .sub{color:var(--dim); font-size:12.5px; padding-bottom:12px}
.topbar .sub b{color:var(--ink)}
.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none; background:none; border:0; border-bottom:2px solid transparent; color:var(--dim);
  font-family:var(--disp); font-size:12.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
  padding:10px 14px 9px; cursor:pointer; white-space:nowrap}
.tab .n{color:var(--faint); margin-right:7px}
.tab:hover{color:var(--ink)}
.tab:focus-visible{outline:1px solid var(--ink); outline-offset:-1px}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--red)}
.tab[aria-selected="true"] .n{color:var(--red)}
/* ---- concept frame ---- */
.panel{padding-top:26px}
.c-head{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:4px}
.c-head .ck{font-size:10px; letter-spacing:.16em; color:var(--red); font-weight:700; text-transform:uppercase}
.c-head h2{font-family:var(--disp); font-size:19px; font-weight:700; text-transform:uppercase; letter-spacing:.04em}
.c-note{color:var(--dim); font-size:13px; max-width:860px; margin-bottom:18px}
.mock{border:1px solid var(--line); background:#0d0d0d; padding:20px 22px 22px}
.app-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; border-bottom:1px solid var(--line); padding-bottom:12px; margin-bottom:18px; flex-wrap:wrap}
.app-head .t{font-family:var(--disp); font-size:26px; font-weight:700; letter-spacing:.02em}
.app-head .m{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:600; text-align:right}
.foot{margin-top:16px; font-size:11px; color:var(--faint); letter-spacing:.06em; text-transform:uppercase}
/* ---- shared components ---- */
.card{border:1px solid var(--line); background:var(--panel); padding:14px 16px 15px; border-radius:2px}
.card h3{font-size:10.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--dim); font-weight:600; display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:11px}
.card h3 .r{color:var(--faint); letter-spacing:.08em}
.grid{display:grid; gap:12px}
.kpis{display:grid; grid-template-columns:repeat(6,1fr); gap:12px}
.kpi{border:1px solid var(--line); background:var(--panel); padding:13px 15px 11px; border-radius:2px}
.kpi .v{font-family:var(--disp); font-size:32px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums}
.kpi .v small{font-size:15px; color:var(--dim); font-weight:600}
.kpi .l{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); font-weight:600; margin-top:7px}
.kpi .s{font-size:11.5px; color:var(--faint); margin-top:2px}
.kpi.red .v{color:var(--red)}
.bar-row{display:grid; grid-template-columns:150px 1fr 44px; align-items:center; gap:10px; padding:3.5px 0}
.bar-row .bl{font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bar-row .tr{height:9px; background:var(--g5)}
.bar-row .fl{height:100%; background:var(--g2)}
.bar-row .fl.hot{background:var(--red)}
.bar-row .bv{font-family:var(--disp); font-weight:600; font-size:13px; text-align:right; font-variant-numeric:tabular-nums}
.seg{display:flex; height:26px; border:1px solid var(--line); overflow:hidden}
.seg div{height:100%}
.seg-legend{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:4px 14px; margin-top:9px}
.seg-legend .li{display:flex; align-items:baseline; gap:7px; font-size:12px; color:var(--dim)}
.seg-legend .dot{width:8px; height:8px; flex:none; position:relative; top:1px}
.seg-legend b{color:var(--ink); font-family:var(--disp); font-variant-numeric:tabular-nums}
.seg-legend .pc{margin-left:auto; color:var(--faint); font-variant-numeric:tabular-nums}
.prog{display:grid; grid-template-columns:170px 1fr 92px; align-items:center; gap:10px; padding:4px 0}
.prog .pl{font-size:12.5px; color:var(--dim)}
.prog .tr{height:6px; background:var(--g5)}
.prog .fl{height:100%; background:var(--g1)}
.prog .pv{font-size:12px; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink)}
.prog .pv span{color:var(--faint)}
table{width:100%; border-collapse:collapse; font-size:12.5px}
th{font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--faint); font-weight:600; text-align:left; padding:5px 8px 6px 0; border-bottom:1px solid var(--line)}
td{padding:5px 8px 5px 0; border-bottom:1px solid var(--line2); vertical-align:top}
td.num, th.num{text-align:right; font-variant-numeric:tabular-nums; padding-right:0}
td.num{font-family:var(--disp); font-weight:600}
table.cht td:first-child{white-space:nowrap; color:var(--faint)}
table.sortable th{cursor:pointer; user-select:none}
table.sortable th:hover{color:var(--ink)}
.stream{display:flex; flex-direction:column}
.st-row{padding:9px 0; border-bottom:1px solid var(--line2)}
.st-row:last-child{border-bottom:0}
.st-row .when{font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--faint); font-weight:600}
.st-row .who{font-weight:600; font-size:13px}
.st-row .what{color:var(--dim); font-size:12.5px; margin-top:1px}
.st-row .src{color:var(--faint); font-size:11.5px}
.tag{display:inline-block; font-size:9px; letter-spacing:.12em; font-weight:700; text-transform:uppercase; padding:1.5px 5px; border:1px solid var(--line); color:var(--dim); vertical-align:1px; margin-left:6px}
.tag.new{color:#fff; background:var(--red); border-color:var(--red)}
.tag.exp{color:var(--ink); border-color:var(--g4)}
.dim{color:var(--dim)} .faint{color:var(--faint)}
.small{font-size:12px} .tiny{font-size:11px}
.mt{margin-top:12px} .mt18{margin-top:18px}
/* concept 2 map */
#atlasMap{height:520px; background:#111; border:1px solid var(--line); z-index:0}
.leaflet-container{font-family:var(--body)}
.leaflet-tooltip{background:#0a0a0a; border:1px solid var(--line); color:var(--ink); border-radius:2px; box-shadow:none; font-family:var(--disp); font-weight:600}
.leaflet-tooltip:before{display:none}
.leaflet-bar a{background:#141414; color:var(--ink); border-color:var(--line)}
.leaflet-control-attribution{background:rgba(10,10,10,.75)!important; color:#555!important; font-size:9px!important}
.leaflet-control-attribution a{color:#777!important}
/* concept 3 rings */
.ring-name{font-family:var(--disp); font-weight:600; fill:var(--ink)}
.ring-guide{font-size:10px; letter-spacing:.14em; fill:var(--faint); font-weight:600; font-family:var(--body)}
.layer-row{display:grid; grid-template-columns:86px 52px 1fr; gap:10px; padding:7px 0; border-bottom:1px solid var(--line2); align-items:baseline}
.layer-row .lr{font-family:var(--disp); font-weight:700; font-size:13px; letter-spacing:.05em}
.layer-row .lc{font-family:var(--disp); font-weight:600; text-align:right; font-variant-numeric:tabular-nums}
.layer-row .ln{color:var(--dim); font-size:12.5px}
.layer-row .ln b{color:var(--ink); font-weight:600}
.score-n{color:var(--faint); font-variant-numeric:tabular-nums; font-size:11.5px}
/* concept 6 */
canvas#constCv{width:100%; height:auto; display:block; background:var(--panel)}
.hub-row{display:grid; grid-template-columns:1fr 74px 74px; gap:8px; padding:5px 0; border-bottom:1px solid var(--line2); font-size:12.5px}
.hub-row .n{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hub-row .v{font-family:var(--disp); font-weight:600; text-align:right; font-variant-numeric:tabular-nums}
@media (max-width:1000px){ .kpis{grid-template-columns:repeat(3,1fr)} }
@media (max-width:760px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .bar-row{grid-template-columns:110px 1fr 38px}
  .prog{grid-template-columns:120px 1fr 84px}
  #atlasMap{height:400px}
  .mock{padding:14px}
}

<script>
/* ============ helpers ============ */
function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function pct(n, d){ return d ? Math.round(100 * n / d) : 0; }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function mulberry(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var GRAYS = ['#f2f2f2','#b5b5b5','#7d7d7d','#4a4a4a','#333333','#222222','#191919','#141414'];
function barsHTML(rows, max, hotFirst){
  return rows.map(function(r, i){
    var w = max > 0 ? Math.max(2, Math.round(1000 * r.c / max) / 10) : 0;
    return '<div class="bar-row"><span class="bl">' + esc(r.label) + '</span><span class="tr"><span class="fl' + (hotFirst && i === 0 ? ' hot' : '') + '" style="width:' + w + '%"></span></span><span class="bv">' + fmt(r.c) + '</span></div>';
  }).join('');
}
function segHTML(segs, total){
  var bar = segs.map(function(s, i){ return '<div style="width:' + (100 * s.c / total) + '%;background:' + GRAYS[i % GRAYS.length] + '" title="' + esc(s.label) + ' &middot; ' + s.c + '"></div>'; }).join('');
  var leg = segs.map(function(s, i){ return '<div class="li"><span class="dot" style="background:' + GRAYS[i % GRAYS.length] + '"></span>' + esc(s.label) + ' <b>' + fmt(s.c) + '</b><span class="pc">' + pct(s.c, total) + '%</span></div>'; }).join('');
  return '<div class="seg">' + bar + '</div><div class="seg-legend">' + leg + '</div>';
}
function appHead(right){
  return '<div class="app-head"><div class="t">HOME</div><div class="m">' + right + '</div></div>';
}

/* ============ CONCEPT 3 — DUNBAR RINGS ============ */
function c3(){
  var d = DATA, L = d.layers, R = d.layerRanges;
  var W = 720, cx = 360, cy = 360;
  var bands = [ { r0:26, r1:78, col:'#f2f2f2', dots:L.counts.l1, dot:3.4 },

                { r0:312, r1:352, col:'#333333', dots:L.counts.l5, dot:1.5 } ];
  var rng = mulberry(20261027), svg = '';
  [352, 302, 228, 150, 78].forEach(function(r){ svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="#262626" stroke-width="1"/>'; });
  var named = L.top5.filter(function(p){ return p.name !== 'JD Meyers'; });

           '<text class="ring-name" x="' + lx.toFixed(1) + '" y="' + (ly + 3).toFixed(1) + '" font-size="12.5" text-anchor="' + anchor + '">' + esc(p.name) + '</text>';

  svg += '<text class="ring-guide" x="' + (cx - 13) + '" y="' + (cy - 92) + '" text-anchor="middle">TOP 5</text>' +

         '<text class="ring-guide" x="' + (cx - 30) + '" y="' + (cy + 322) + '" text-anchor="middle">51&ndash;150</text>' +
         '<text class="ring-guide" x="' + (cx - 116) + '" y="' + (cy - 306) + '" text-anchor="middle">150+</text>';

var constDone = false;
function drawConst(){
  if(constDone) return; constDone = true;
  var cv = document.getElementById('constCv'); if(!cv) return;
  var dpr = window.devicePixelRatio || 1;
  var W = 1180, H = 800;
  cv.width = W * dpr; cv.height = H * dpr;
  var ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  var nodes = DATA.const.nodes.map(function(n, i){ return { u:n.u, name:n.name, deg:n.degree, x:0, y:0, vx:0, vy:0 }; });
  var byU = {}; nodes.forEach(function(n){ byU[n.u.toLowerCase()] = n; });
  var edges = DATA.const.edges.filter(function(e){ return byU[e[0].toLowerCase()] && byU[e[1].toLowerCase()]; })
    .map(function(e){ return [byU[e[0].toLowerCase()], byU[e[1].toLowerCase()]]; });
  var inDeg = {}; nodes.forEach(function(n){ inDeg[n.u] = 0; });
  edges.forEach(function(e){ inDeg[e[0].u]++; inDeg[e[1].u]++; });
  var rng = mulberry(451);
  nodes.forEach(function(n, i){
    var a = (i / nodes.length) * Math.PI * 2, r = 130 + rng() * 170;
    n.x = W / 2 + r * Math.cos(a); n.y = H / 2 + r * Math.sin(a);
  });
  var jd = byU['jdmeyers_']; if(jd){ jd.x = W / 2; jd.y = H / 2; }
  /* Fruchterman-Reingold, run to rest synchronously (the drawing is
     static; nothing animates). JD stays pinned at the center. */
  var K = Math.sqrt(W * H / nodes.length) * 1.02, temp = 110;
  for(var it = 0; it < 600; it++){
    nodes.forEach(function(n){ n.vx = 0; n.vy = 0; });
    for(var i = 0; i < nodes.length; i++){
      var a = nodes[i];
      for(var j = i + 1; j < nodes.length; j++){
        var b = nodes[j], dx = a.x - b.x, dy = a.y - b.y;
        var dl = Math.sqrt(dx * dx + dy * dy) || .01, f = K * K / dl / dl;
        a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
      }
    }
    edges.forEach(function(e){
      var a = e[0], b = e[1], dx = a.x - b.x, dy = a.y - b.y;
      var dl = Math.sqrt(dx * dx + dy * dy) || .01, f = dl / K;
      a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
    });
    nodes.forEach(function(n){
      n.vx += (W / 2 - n.x) * .012; n.vy += (H / 2 - n.y) * .012;
      var dl = Math.sqrt(n.vx * n.vx + n.vy * n.vy) || .01, step = Math.min(dl, temp);
      if(n !== jd){ n.x += n.vx / dl * step; n.y += n.vy / dl * step; }
      n.x = Math.max(58, Math.min(W - 58, n.x)); n.y = Math.max(42, Math.min(H - 42, n.y));
    });
    temp = Math.max(2, temp * .987);
  }
  ctx.strokeStyle = 'rgba(242,242,242,.13)'; ctx.lineWidth = 1;
  edges.forEach(function(e){ ctx.beginPath(); ctx.moveTo(e[0].x, e[0].y); ctx.lineTo(e[1].x, e[1].y); ctx.stroke(); });
  ctx.font = '600 12.5px Archivo'; 
  nodes.forEach(function(n){
    var r = 3 + (n.deg / 690) * 10;
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    ctx.fillStyle = n.u === 'jdmeyers_' ? '#e30613' : '#d9d9d9'; ctx.fill();
    ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 1.4; ctx.stroke();
  });
  ctx.textAlign = 'center';
  nodes.forEach(function(n){
    if(n.u !== 'jdmeyers_' && inDeg[n.u] < 5) return;
    var r = 3 + (n.deg / 690) * 10;
    ctx.fillStyle = '#f2f2f2';
    ctx.fillText(n.name, n.x, n.y - r - 6);
  });
}

/* ============ tabs ============ */
var CONCEPTS = [
  { t:'Command Deck', n:'Numbers first. The six figures that describe the whole directory up top, then honest bars &mdash; every ranking proportional, nothing decorative.', fn:c1 },
  { t:'Atlas', n:'Geography first. Where everyone actually is, on a real map of St. Lawrence County &mdash; the directory is a place before it is a list.', fn:c2 },
  { t:'Dunbar Rings', n:'Closeness first. JD at the center, everyone else on their Dunbar ring &mdash; the inner circles named, the outer rings counted.', fn:c3 },
  { t:'Timeline', n:'Time first. Every start year on file as one river &mdash; pre-2010 through 2026 &mdash; with the Live Records stream and the change log running beside it.', fn:c4 },
  { t:'Ledger', n:'Tables only, zero charts. The whole Home as a briefing sheet &mdash; dense, sortable, scannable in ten seconds.', fn:c5 },
  { t:'Constellation', n:'Connections first. The most-connected people and the links between them &mdash; who actually holds this network together.', fn:c6 }
];
var tablist = document.getElementById('tablist'), panels = document.getElementById('panels');
CONCEPTS.forEach(function(c, i){
  var b = document.createElement('button');
  b.className = 'tab'; b.id = 'tab-' + (i + 1); b.setAttribute('role', 'tab');
  b.setAttribute('aria-selected', 'false'); b.tabIndex = -1;
  b.innerHTML = '<span class="n">0' + (i + 1) + '</span>' + c.t;
  b.addEventListener('click', function(){ select(i, true); });
  tablist.appendChild(b);
  var s = document.createElement('section');
  s.className = 'panel'; s.id = 'panel-' + (i + 1); s.setAttribute('role', 'tabpanel');
  s.setAttribute('aria-labelledby', 'tab-' + (i + 1)); s.hidden = true; s.tabIndex = 0;
  s.innerHTML = '<div class="c-head"><span class="ck">Concept 0' + (i + 1) + '</span><h2>' + c.t + '</h2></div>' +
    '<p class="c-note">' + c.n + '</p><div class="mock">' + c.fn() + '</div>' +
    '<p class="foot">Concept ' + (i + 1) + ' of 6 &middot; Figures: live bake, Oct 27, 2026 &middot; Swiss Mono</p>';
  panels.appendChild(s);
});
var cur = -1;
function select(i, push){
  if(i === cur) return; cur = i;
  Array.prototype.forEach.call(tablist.children, function(b, j){
    b.setAttribute('aria-selected', j === i ? 'true' : 'false'); b.tabIndex = j === i ? 0 : -1;
  });
  Array.prototype.forEach.call(panels.children, function(p, j){ p.hidden = j !== i; });
  if(push) history.replaceState(null, '', '#' + (i + 1));
  if(i === 1) initAtlas();
  if(i === 5) drawConst();
}
tablist.addEventListener('keydown', function(ev){
  var i = cur;
  if(ev.key === 'ArrowRight') i = (cur + 1) % CONCEPTS.length;
  else if(ev.key === 'ArrowLeft') i = (cur + CONCEPTS.length - 1) % CONCEPTS.length;
  else if(ev.key === 'Home') i = 0;
  else if(ev.key === 'End') i = CONCEPTS.length - 1;
  else return;
  ev.preventDefault(); select(i, true); tablist.children[i].focus();
});
var start = parseInt((location.hash || '').slice(1), 10);
select(isNaN(start) || start < 1 || start > 6 ? 0 : start - 1, false);

/* ledger sorting */
document.addEventListener('click', function(ev){
  var th = ev.target.closest ? ev.target.closest('table.sortable th') : null;
  if(!th) return;
  var table = th.closest('table'), idx = Array.prototype.indexOf.call(th.parentNode.children, th);
  var rows = Array.prototype.slice.call(table.tBodies[0].rows);
  var dir = th.dataset.dir === 'asc' ? 'desc' : 'asc'; th.dataset.dir = dir;
  function val(r){ var t = r.cells[idx] ? r.cells[idx].textContent.trim() : ''; var n = parseFloat(t.replace(/[^0-9.\-]/g, '')); return isNaN(n) || /[A-Za-z]{3,}/.test(t.replace(/,/g,'')) && idx !== 0 ? t : (isNaN(n) ? t : n); }
  rows.sort(function(a, b){
    var va = val(a), vb = val(b);
    var c = (typeof va === 'number' && typeof vb === 'number') ? va - vb : String(va).localeCompare(String(vb));
    return dir === 'asc' ? c : -c;
  });
  rows.forEach(function(r){ table.tBodies[0].appendChild(r); });
});
