<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>North Country Circle</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="stage">
  <canvas id="map"></canvas>

  <div class="hud hud-tl">
    <div class="brand">NORTH COUNTRY <span>CIRCLE</span></div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="hud hud-tc">
    <div class="searchbox">
      <input id="q" placeholder="Find a person — handle or name…  ( / )" autocomplete="off" spellcheck="false">
      <div id="results" class="results" hidden></div>
    </div>
    <div class="trail" id="trail" hidden></div>
  </div>

  <div class="hud hud-tr">
    <button id="btn-filters" class="tbtn" title="Navigation filters">Filters</button>
    <button id="btn-hubs" class="tbtn" title="Highlight the top connectors">Hubs</button>
    <button id="btn-dir" class="tbtn" title="Open the directory">Directory</button>
    <button id="btn-reset" class="tbtn" title="Reset view (0)">Reset</button>
  </div>

  <aside class="hud panel" id="filters" hidden>
    <h3>Navigate</h3>
    <label class="slider-label">Minimum connections <b id="minconn-val">0</b></label>
    <input type="range" id="minconn" min="0" max="100" value="0" step="1">
    <label class="check"><input type="checkbox" id="f-jd"> Followed by JD</label>
    <label class="check"><input type="checkbox" id="f-list"> List collected</label>
    <label class="check"><input type="checkbox" id="f-isolate"> Isolate selected neighbors</label>
    <label class="check"><input type="checkbox" id="f-bridges"> Highlight long-range bridges</label>
    <div class="note" id="vis-count"></div>
  </aside>

  <aside class="hud panel detail" id="detail" hidden></aside>

  <aside class="hud drawer" id="directory" hidden>
    <div class="drawer-head">
      <h3>Directory</h3>
      <button id="dir-close" class="tbtn">Close</button>
    </div>
    <input id="dir-q" placeholder="Search handle or name…" autocomplete="off" spellcheck="false">
    <div class="note" id="dir-count"></div>
    <div id="dir-list"></div>
  </aside>

  <div class="hud zoomctl">
    <button id="zin" aria-label="Zoom in">+</button>
    <button id="zout" aria-label="Zoom out">&minus;</button>
    <button id="zfit" aria-label="Reset view">&#10226;</button>
  </div>

  <div class="hud hint">Drag&nbsp;pan &middot; Scroll&nbsp;zoom &middot; Click&nbsp;node for details &middot; <b>/</b>&nbsp;search &middot; <b>Esc</b>&nbsp;clear</div>

  <div class="hud mobile-note" id="mobile-note" hidden>
    This explorer is built for desktop — it works here, but the full toolset needs a bigger screen.
    <button id="mobile-note-x">Got it</button>
  </div>
</div>
<div class="tooltip" id="tooltip" hidden></div>
<script src="data/data.js"></script>
<script src="app.js"></script>
</body>
</html>
