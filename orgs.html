<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080d">
<title>Organizations — North Country Circle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06080d;--panel:#0c1017;--line:rgba(255,255,255,.09);--line-soft:rgba(255,255,255,.055);
--txt:#ece9e2;--dim:#8b95a7;--fill:rgba(255,255,255,.04);--ease:cubic-bezier(.22,.9,.28,1);
--disp:'Space Grotesk',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;min-height:100vh}
header.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:14px 22px;
background:rgba(6,8,13,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft)}
header.top h1{font-family:var(--disp);font-size:19px;margin:0}
header.top small{color:var(--dim);font-size:12px}
header.top a.back{color:var(--dim);text-decoration:none;font-size:13px;font-weight:600}
header.top a.back:hover{color:var(--txt)}
.tsearch{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--fill);
border:1px solid var(--line-soft);border-radius:999px;padding:7px 14px;min-width:220px}
.tsearch input{background:none;border:0;outline:0;color:var(--txt);font-size:13px;width:100%}
.cats{display:flex;gap:8px;padding:18px 22px 0;flex-wrap:wrap}
.cats button{border:1px solid var(--line-soft);background:var(--fill);color:var(--dim);font-weight:700;
font-size:13px;border-radius:999px;padding:8px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.cats button.on{color:var(--txt);border-color:var(--c)}
.cats button .n{font-size:11px;background:rgba(255,255,255,.08);border-radius:999px;padding:1px 8px}
main{padding:18px 22px 60px;max-width:1100px;margin:0 auto}
.org{border:1px solid var(--line-soft);border-radius:14px;background:var(--panel);margin-bottom:12px;overflow:hidden}
.org>header{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;user-select:none}
.org>header:hover{background:rgba(255,255,255,.025)}
.org>header .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.org>header h3{margin:0;font-size:15px;font-weight:700;flex:1}
.org>header .cnt{font-size:12px;color:var(--dim);font-weight:700;background:var(--fill);
border:1px solid var(--line-soft);border-radius:999px;padding:2px 10px}
.org>header .chev{color:var(--dim);transition:transform .18s var(--ease)}
.org.open>header .chev{transform:rotate(180deg)}
.org .body{display:none;padding:4px 16px 14px}
.org.open .body{display:block}
.person{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:13.5px}
.person:first-child{border-top:0}
.person .ava{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
font-size:11px;font-weight:800;background:var(--fill);border:1px solid var(--line-soft);flex:none}
.person a{color:var(--txt);text-decoration:none;font-weight:600}
.person a:hover{text-decoration:underline}
.person .sub{color:var(--dim);font-size:12px;margin-left:auto;text-align:right}
.sortrow{display:flex;align-items:center;gap:10px;padding:0 22px;max-width:1100px;margin:0 auto;color:var(--dim);font-size:12px}
.sortrow select{background:var(--panel);color:var(--txt);border:1px solid var(--line-soft);border-radius:8px;
padding:5px 10px;font-size:12.5px}
.empty{color:var(--dim);text-align:center;padding:60px 20px;font-size:14px}
</style>
</head>
<body>
<header class="top">
  <a class="back" href="dossier.html">&larr; Dossier</a>
  <h1>Organizations</h1><small>who's involved where</small>
  <label class="tsearch"><input id="q" type="search" placeholder="Search people or orgs&hellip;" autocomplete="off"></label>
</header>
<div class="cats" id="cats"></div>
<div class="sortrow"><span>Sort orgs by</span>
  <select id="sort"><option value="count">most people</option><option value="name">name A&ndash;Z</option></select>
</div>
<main id="main"></main>
<script>
var CATS = [
  {k:'universities', n:'Universities', c:'#7ea6f0'},
  {k:'churches',     n:'Churches',     c:'#c9a0f0'},
  {k:'companies',    n:'Companies',    c:'#f0b44c'}
];
var D = null, activeCat = 'universities', q = '', sortMode = 'count';
function disp(e){ return e.display || (e.name ? '@'+e.name : 'Unnamed'); }
function prof(e){ return e.profile || {}; }
function orgMembers(cat){
  var map = {};
  (D.directory || []).forEach(function(e, i){
    if((prof(e).deleted === '1')) return;
    String(prof(e)[cat] || '').split(',').map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(o){
      (map[o] = map[o] || []).push(i);
    });
  });
  return map;
}
function render(){
  var cat = CATS.filter(function(c){ return c.k === activeCat; })[0];
  document.getElementById('cats').innerHTML = CATS.map(function(c){
    var m = orgMembers(c.k), n = Object.keys(m).length;
    return '<button data-cat="'+c.k+'" class="'+(c.k===activeCat?'on':'')+'" style="--c:'+c.c+'">'+c.n+' <span class="n">'+n+'</span></button>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#cats button'), function(b){
    b.onclick = function(){ activeCat = b.getAttribute('data-cat'); render(); };
  });
  var map = orgMembers(activeCat), ql = q.trim().toLowerCase();
  var orgs = Object.keys(map).filter(function(o){
    if(!ql) return true;
    if(o.toLowerCase().indexOf(ql) >= 0) return true;
    return map[o].some(function(i){ return disp(D.directory[i]).toLowerCase().indexOf(ql) >= 0; });
  });
  orgs.sort(function(a, b){
    return sortMode === 'name' ? a.localeCompare(b) : (map[b].length - map[a].length || a.localeCompare(b));
  });
  var main = document.getElementById('main');
  if(!orgs.length){ main.innerHTML = '<div class="empty">No organizations found.</div>'; return; }
  main.innerHTML = orgs.map(function(o){
    var members = map[o].slice().sort(function(a, b){ return disp(D.directory[a]).localeCompare(disp(D.directory[b])); });
    var rows = members.map(function(i){
      var e = D.directory[i], p = prof(e);
      var sub = [p.display_name && p.display_name !== disp(e) ? null : null,
                 e.relation === 'mutual' ? 'mutual' : null,
                 p.phone ? 'has phone' : null].filter(Boolean).join(' · ');
      var av = (disp(e).replace(/^@/,'').trim().charAt(0) || '·').toUpperCase();
      return '<div class="person"><span class="ava">'+av+'</span><a href="dossier.html#'+encodeURIComponent(e.name || '')+'">'+disp(e)+'</a>'+
        (sub ? '<span class="sub">'+sub+'</span>' : '') + '</div>';
    }).join('');
    return '<div class="org" style="--c:'+cat.c+'"><header><span class="dot"></span><h3>'+o+
      '</h3><span class="cnt">'+members.length+'</span><span class="chev">▾</span></header>'+
      '<div class="body">'+rows+'</div></div>';
  }).join('');
  Array.prototype.forEach.call(main.querySelectorAll('.org > header'), function(h){
    h.onclick = function(){ h.parentNode.classList.toggle('open'); };
  });
}
document.getElementById('q').addEventListener('input', function(e){ q = e.target.value; render(); });
document.getElementById('sort').addEventListener('change', function(e){ sortMode = e.target.value; render(); });
fetch('data/dossier.json').then(function(r){ return r.json(); }).then(function(d){ D = d; render(); })
  .catch(function(){ document.getElementById('main').innerHTML = '<div class="empty">Could not load dossier data.</div>'; });
</script>
</body>
</html>
